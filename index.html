<style>
/* ============================================================
   Windows 32BIT MAX — single file OS
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
html{font-size:16px}
body{
  font-family:'Segoe UI Variable Text','Segoe UI Variable','Segoe UI',system-ui,-apple-system,'Inter','Noto Sans','Noto Sans SC',sans-serif;
  background:#000;color:#fff;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;cursor:default;
}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:default}
img{-webkit-user-drag:none;user-drag:none}
:root{
  --tb-h:48px;
  --r-win:8px;--r-ctl:4px;
  --accent:#0078d4;--accent-fg:#ffffff;
  --accent-hover:#0078d4;--accent-active:#0078d4;--accent-soft:rgba(0,120,212,.18);
  --mono:'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace;
}
[data-theme="light"]{
  --surface:rgba(243,243,243,.82);--surface-solid:#f3f3f3;
  --card:rgba(255,255,255,.66);--card-solid:#fbfbfb;
  --stroke:rgba(0,0,0,.065);--stroke-strong:rgba(0,0,0,.14);
  --text:#1b1b1b;--text2:rgba(0,0,0,.605);--text3:rgba(0,0,0,.42);
  --menu:rgba(243,243,243,.92);--hover:rgba(0,0,0,.046);--active:rgba(0,0,0,.085);
  --shadow-win:0 26px 64px rgba(0,0,0,.30),0 2px 10px rgba(0,0,0,.16);
  --shadow-fly:0 10px 36px rgba(0,0,0,.24);
  --shadow-soft:0 4px 14px rgba(0,0,0,.10);
  --scrim:rgba(255,255,255,.4);--desk-fallback:#3a5d8f;
  --cap-hover:rgba(0,0,0,.055);--skimmer:rgba(0,0,0,.03);
}
[data-theme="dark"]{
  --surface:rgba(32,32,32,.82);--surface-solid:#202020;
  --card:rgba(255,255,255,.052);--card-solid:#2b2b2b;
  --stroke:rgba(255,255,255,.075);--stroke-strong:rgba(255,255,255,.15);
  --text:#ffffff;--text2:rgba(255,255,255,.72);--text3:rgba(255,255,255,.5);
  --menu:rgba(40,40,40,.92);--hover:rgba(255,255,255,.06);--active:rgba(255,255,255,.1);
  --shadow-win:0 26px 64px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4);
  --shadow-fly:0 10px 36px rgba(0,0,0,.5);
  --shadow-soft:0 4px 14px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.42);--desk-fallback:#101a2b;
  --cap-hover:rgba(255,255,255,.07);--skimmer:rgba(255,255,255,.03);
}
html.noanim *,html.noanim *::before,html.noanim *::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
html.notrans .acrylic,html.notrans .flyout,html.notrans .win,html.notrans #taskbar,html.notrans .menu{backdrop-filter:none!important;background:var(--surface-solid)!important}
html.hc-aquatic{--surface:#000;--surface-solid:#000;--card:#0a2a4a;--card-solid:#0a2a4a;--stroke:#4cf;--stroke-strong:#8df;--text:#fff;--text2:#cde;--text3:#9bd;--menu:#000f22;--hover:#123456;--active:#1a4a7a;--accent:#4cc2ff}
html.hc-desert{--surface:#2c1e0f;--surface-solid:#2c1e0f;--card:#4a3319;--card-solid:#4a3319;--stroke:#fc0;--stroke-strong:#ffd76b;--text:#fff5e6;--text2:#f0dcb8;--text3:#d8bc8c;--menu:#241708;--hover:#5a4020;--active:#6b4c26;--accent:#ffc83d}
html.hc-dusk{--surface:#0b0b1e;--surface-solid:#0b0b1e;--card:#241a47;--card-solid:#241a47;--stroke:#c9b8ff;--stroke-strong:#e0d4ff;--text:#f2ecff;--text2:#cfc2f0;--text3:#a89ad0;--menu:#120c2b;--hover:#2f2358;--active:#3b2c6e;--accent:#b8a6ff}
html.hc-nightsky{--surface:#000;--surface-solid:#000;--card:#101c10;--card-solid:#101c10;--stroke:#6f6;--stroke-strong:#9f9;--text:#eaffea;--text2:#bde;--text3:#8c8;--menu:#04140a;--hover:#14301c;--active:#1c4026;--accent:#6ccb5f}
html.filter-gray #shell{filter:grayscale(1)}
html.filter-inv #shell{filter:invert(1) hue-rotate(180deg)}
html.filter-grayinv #shell{filter:grayscale(1) invert(1) hue-rotate(180deg)}
html.hdr #shell{filter:saturate(1.22) contrast(1.04)}
::selection{background:var(--accent-soft)}
/* scrollbars */
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px;border:3.5px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.75);border-width:2.5px;background-clip:content-box}
html.always-sb *::-webkit-scrollbar-thumb{background:rgba(128,128,128,.75);border-width:2.5px;background-clip:content-box}
/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#000;z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .5s}
#boot.show{display:flex}
#boot.fade{opacity:0;pointer-events:none}
#bootLogo{width:96px;height:96px;animation:bootIn .9s cubic-bezier(.2,.8,.2,1)}
@keyframes bootIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
#bootBrand{font-size:22px;font-weight:600;letter-spacing:.5px;color:#fff}
#bootBrand b{color:#4cc2ff;font-weight:700}
#bootSpinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#4cc2ff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bootText{position:absolute;left:24px;bottom:20px;font:12px/1.5 var(--mono);color:#27c93f;white-space:pre-wrap;display:none;text-shadow:0 0 6px rgba(39,201,63,.5)}
#boot.fade #bootText{display:none!important}
/* ============ POWER OFF ============ */
#poweroff{position:fixed;inset:0;background:#000;z-index:9500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:26px}
#poweroff.show{display:flex}
#poweroff .p-msg{color:#8a8a8a;font-size:15px;display:flex;align-items:center;gap:12px}
#poweroff .p-msg .spin{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:#aaa;animation:spin 1s linear infinite}
#powerBtn{width:74px;height:74px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;color:#666;transition:.25s;cursor:pointer}
#powerBtn:hover{border-color:#4cc2ff;color:#4cc2ff;box-shadow:0 0 34px rgba(76,194,255,.35),inset 0 0 14px rgba(76,194,255,.15)}
#poweroff .p-hint{color:#3c3c3c;font-size:12px}
/* ============ LOCK SCREEN ============ */
#lock{position:fixed;inset:0;z-index:8000;display:none;background-size:cover;background-position:center}
#lock.show{display:block}
#lock .lock-shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.38));transition:.45s}
#lock.clock-view .lock-shade{backdrop-filter:blur(0px)}
#lock.login-view .lock-shade{backdrop-filter:blur(26px) saturate(1.2);background:rgba(0,0,0,.44)}
#lockClockWrap{position:absolute;left:0;right:0;top:16%;text-align:center;color:#fff;transition:.45s cubic-bezier(.2,.8,.2,1)}
#lock.login-view #lockClockWrap{transform:translateY(-34px) scale(.92);opacity:0;pointer-events:none}
#lockTime{font-size:clamp(56px,9vw,104px);font-weight:600;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
#lockDate{font-size:clamp(16px,2.2vw,26px);font-weight:500;margin-top:10px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#lockHint{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:rgba(255,255,255,.85);font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.6);animation:hintPulse 2.6s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}
#lockLogin{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);display:none;flex-direction:column;align-items:center;gap:14px;color:#fff}
#lock.login-view #lockLogin{display:flex;animation:loginIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes loginIn{from{opacity:0;transform:translate(-50%,-38%)}to{opacity:1;transform:translate(-50%,-46%)}}
#lockAvatar{width:100px;height:100px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.35)}
#lockName{font-size:24px;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#lockPinRow{display:flex;gap:8px;margin-top:2px}
#lockPin{width:230px;height:34px;border-radius:4px;border:none;outline:none;background:rgba(255,255,255,.9);color:#111;padding:0 12px;font-size:14px;text-align:center;letter-spacing:6px}
#lockPin.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#lockErr{font-size:12px;color:#ffb3b3;height:14px}
#lockBtn{padding:0 26px;height:34px;border-radius:4px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:13px;transition:.2s}
#lockBtn:hover{background:rgba(255,255,255,.32)}
/* ============ SHELL / DESKTOP ============ */
#shell{position:fixed;inset:0;overflow:hidden;background:var(--desk-fallback);display:none}
#shell.show{display:block}
#desktop{position:absolute;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:repeat;transition:background-image .4s,transform .6s cubic-bezier(.2,.8,.2,1)}
#wallTint{position:absolute;inset:0;pointer-events:none}
/* desktop icon grid: fixed cells, column-major like Windows.
   Grid is BACK so icons align neatly. The only change from the original:
   dragging an icon onto an OCCUPIED cell no longer swaps — the dragged
   icon snaps back to its original cell. Other icons NEVER move. */
/* desktop icon grid: column-major like Windows.
   overflow-x:auto lets icons flow off the right edge when there are too many,
   and the user can scroll horizontally to see them all. overflow-y:hidden so
   vertical content never scrolls (icons always fit in rows). The grid uses
   auto-fill rows that consume the full height, and auto-columns that grow
   horizontally as more icons are added.
   === PERFORMANCE OPTIMIZATIONS for large collections (100+ icons) ===
   contain:layout paint — tells the browser each .dicon is independent so it
     can skip re-laying-out siblings when one icon changes/hovers.
   will-change:transform on the grid — promotes the whole grid to a GPU layer
     so scrolling is smooth even with 500+ icons.
   backface-visibility:hidden — extra GPU hint to avoid re-painting during scroll.
   transform:translateZ(0) on .dicon — promotes each icon to its own GPU layer
     so hover/selection changes don't trigger re-paint of the entire grid. */
#icons{position:absolute;left:4px;top:4px;bottom:56px;right:4px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,minmax(var(--dc-h,96px),1fr));grid-auto-columns:var(--dc-w,90px);padding:4px;justify-items:center;align-items:start;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* Custom horizontal scrollbar — slim and themed, doesn't waste desktop space */
#icons::-webkit-scrollbar{height:10px;width:10px}
#icons::-webkit-scrollbar-track{background:transparent}
#icons::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:5px;border:2px solid transparent;background-clip:content-box}
#icons::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.7);border-width:1px;background-clip:content-box}
.dicon{width:calc(var(--dc-w,90px) - 4px);padding:8px 2px 6px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid transparent;touch-action:none;user-select:none;-webkit-user-select:none;contain:layout paint;transform:translateZ(0)}
.dicon:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12)}
.dicon.sel{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
#marquee{position:absolute;z-index:48;border:1px solid var(--accent);background:var(--accent-soft);pointer-events:none;display:none;box-sizing:border-box;border-radius:2px}
.dicon.dragging{opacity:.65;z-index:50;box-shadow:0 8px 22px rgba(0,0,0,.5);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.dicon.dragging .lbl{opacity:.85}
#dropHint{position:absolute;z-index:49;width:var(--dc-w,90px);height:var(--dc-h,96px);border:1.5px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.14);border-radius:6px;pointer-events:none;display:none;box-sizing:border-box}
.dicon .ic{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.dicon .lbl{font-size:12px;line-height:1.25;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.4);max-height:31px;overflow:hidden;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:ellipsis;width:100%}
#desktop.dark-lbl .dicon .lbl{color:#fff}
/* webapp real-logo tile */
.wfa{width:100%;height:100%;border-radius:22%;background:linear-gradient(180deg,#ffffff,#eef0f4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.wfa b{position:absolute;font-family:'Segoe UI',Arial,sans-serif;font-weight:700;line-height:1;user-select:none}
.wfa img{width:66%;height:66%;object-fit:contain;position:relative;z-index:1}
.dicon input.rn{width:80px;font-size:12px;text-align:center;border-radius:3px;border:1px solid var(--accent);outline:none;background:#fff;color:#111}
#watermark{position:absolute;right:18px;bottom:64px;text-align:right;color:rgba(255,255,255,.5);font-size:13px;line-height:1.4;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;display:none}
#shell.dev-wm #watermark{display:block}
#windows{position:absolute;left:0;right:0;top:0;bottom:var(--tb-h);pointer-events:none}
#snapPrev{position:absolute;z-index:9999;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:8px;display:none;pointer-events:none;transition:all .12s ease-out}
#nightFx{position:fixed;inset:0;z-index:9600;pointer-events:none;background:rgb(255 132 40);mix-blend-mode:multiply;opacity:0;transition:opacity .6s}
#dimFx{position:fixed;inset:0;z-index:9601;pointer-events:none;background:#000;opacity:0}
</style>

<style>
/* ============ TASKBAR ============ */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:var(--tb-h);z-index:1000;display:flex;align-items:center;
  background:var(--surface);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);
  border-top:1px solid var(--stroke);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#shell.autohide #taskbar{transform:translateY(calc(100% + 2px))}
#shell.autohide #taskbar:hover,#shell.autohide .tb-hoverzone:hover~#taskbar{transform:none}
.tb-hoverzone{position:absolute;left:0;right:0;bottom:0;height:6px;z-index:999}
#tbLeft{position:absolute;left:10px;top:0;bottom:0;display:flex;align-items:center}
#tbCenter{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;display:flex;align-items:center;gap:4px}
#shell.tb-left #tbCenter{left:10px;transform:none}
#tbRight{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center}
.tbi{width:42px;height:42px;border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .12s}
.tbi:hover{background:var(--hover)}
.tbi:active{background:var(--active)}
.tbi .ic{width:25px;height:25px;transition:transform .1s}
.tbi:active .ic{transform:scale(.86)}
.tbi.running::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:var(--text3);transition:.2s}
.tbi.active::after{width:17px;background:var(--accent)}
.tbi .tip{position:absolute;bottom:52px;left:50%;transform:translateX(-50%) scale(.94);background:var(--menu);backdrop-filter:blur(20px);border:1px solid var(--stroke);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s .35s;box-shadow:var(--shadow-soft);z-index:2000}
.tbi .tip{display:flex;align-items:center;gap:10px;pointer-events:auto;visibility:hidden}.tbi:hover .tip,.tbi:focus-visible .tip{visibility:visible}.tbi .tip-close{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:16px;line-height:1;color:var(--text);cursor:pointer}.tbi .tip-close:hover{background:var(--hover)}
.tbi:hover .tip{opacity:1;transform:translateX(-50%) scale(1)}
#tbWidgets{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--text)}
#tbWidgets:hover{background:var(--hover)}
#tbWidgets .w-ic{width:22px;height:22px}
#tbWidgets .w-t{display:flex;flex-direction:column;line-height:1.2;align-items:flex-start}
#tbWidgets .w-t b{font-weight:600;font-size:12px}
#tbWidgets .w-t span{font-size:10.5px;color:var(--text2)}
#trayCluster{display:flex;align-items:center;gap:7px;height:40px;padding:0 9px;border-radius:5px;color:var(--text)}
#trayCluster:hover{background:var(--hover)}
#trayCluster svg{width:17px;height:17px}
#trayClock{height:40px;padding:0 9px;border-radius:5px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-size:11.5px;line-height:1.3;color:var(--text);font-variant-numeric:tabular-nums}
#trayClock:hover{background:var(--hover)}
#tbShowDesk{width:8px;height:100%;margin-left:2px}
#tbShowDesk:hover{background:var(--hover)}
/* ============ FLYOUTS ============ */
.flyout{position:absolute;z-index:1100;background:var(--surface);backdrop-filter:blur(50px) saturate(1.7);-webkit-backdrop-filter:blur(50px) saturate(1.7);
  border:1px solid var(--stroke-strong);border-radius:8px;box-shadow:var(--shadow-fly);
  opacity:0;pointer-events:none;transform:translateY(18px);transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.2,1)}
.flyout.show{opacity:1;pointer-events:auto;transform:translateY(0)}
/* Start menu */
#startMenu{left:50%;margin-left:-302px;bottom:58px;width:604px;max-height:calc(100% - 76px);display:flex;flex-direction:column;padding:0}
#shell.tb-left #startMenu{left:10px;margin-left:0}
.sm-search{margin:26px 26px 14px;display:flex;align-items:center;gap:10px;height:36px;border-radius:18px;background:var(--card);border:1px solid var(--stroke);padding:0 14px;color:var(--text2)}
.sm-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sm-search svg{width:15px;height:15px;flex:none}
.sm-search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13.5px}
.sm-search input::placeholder{color:var(--text3)}
#smBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 26px 10px}
.sm-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;font-size:13.5px;font-weight:600;color:var(--text)}
.sm-head button{font-size:12px;font-weight:500;background:var(--card);border:1px solid var(--stroke);padding:4px 12px;border-radius:4px;color:var(--text2);display:flex;align-items:center;gap:4px}
.sm-head button:hover{background:var(--hover)}

/* Triggered by #shell.mobile — set by applyMobileMode() when a mobile device

<!-- fflate: tiny pure-JS zip/unzip library (~30KB). Used to recursively extract

     zip-of-ROM-folders, etc. Loaded async on first use so it doesn't slow down
     the OS boot for users who never upload zips. -->
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" defer></script>
<!-- 7z-wasm: 7-Zip extractor compiled to WebAssembly (~250KB). Used to extract
     .7z collections uploaded to Game Hub. Many ROM packs are distributed as .7z
     because the compression ratio is much better than .zip (LZMA2). Loaded
     async on first use. The UMD file 7zz.umd.js exposes window.SevenZip (a
     factory function — calling SevenZip() returns a Promise<Module>). -->
<script src="https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.umd.js" defer></script>
<!-- js-dos: DOSBox compiled to WebAssembly. Loaded DYNAMICALLY in openDOSFile()
     only when a DOS game is launched — NOT in the head section. Loading it here
     with defer caused the entire OS to break because js-dos.js manipulates the DOM
     on load (injects link tags, queries selectors) which can throw errors that
     kill the main script execution. By loading dynamically, any js-dos errors
     are isolated to the DOS emulator window and don't affect the rest of the OS. -->
</head>

/* ============ TASK MANAGER v2 ============ */
.tm2{display:flex;height:100%;min-height:0}

.gh-card .foot{display:flex;gap:6px;align-items:center}
.gh-prog{height:4px;border-radius:2px;background:var(--hover);overflow:hidden;display:none;flex:1}
.gh-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.gh-mylist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.gh-myrow{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:7px;background:var(--card);border:1px solid var(--stroke)}
.gh-myrow b{font-size:12.5px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-myrow span{font-size:11px;color:var(--text2)}
.gh-empty{font-size:12px;color:var(--text3);padding:6px 2px 10px}
/* ============ PROPERTIES ============ */
.prop-top{display:flex;gap:14px;align-items:center;margin-top:6px}
.prop-ic{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px}
.prop-ic .ic svg{width:52px;height:52px}
.prop-ic img{width:52px;height:52px;object-fit:contain}
.prop-name{font-size:15px;font-weight:600;color:var(--text);word-break:break-all}
.prop-tbl{margin-top:14px;border-top:1px solid var(--stroke)}
.prop-tbl>div{display:flex;padding:7px 2px;border-bottom:1px solid var(--stroke);font-size:12.5px;gap:12px}
.prop-tbl b{width:112px;flex:none;color:var(--text2);font-weight:400;white-space:nowrap}
.prop-tbl span{color:var(--text);word-break:break-all}
.prop-iconrow{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.prop-iconrow .lbl{font-size:12.5px;color:var(--text2)}
</style>

function I(name,sz,cls){
  /* If `name` is a data: URL OR an http(s)/blob: URL (custom uploaded icon image,

     in APPICON/LINE. This lets custom game icons, custom webapp icons, etc.
     display everywhere iconEl() is used — title bars, taskbar, context menus,
     Start menu. */

}

/* === REAL DEVICE STORAGE (navigator.storage.estimate) ===
   The OS used to hardcode "5 GB simulated storage", which both looked fake and
   hid how much real space the user actually had. navigator.storage.estimate()
   returns the real quota the browser will grant this origin — on desktop Chrome
   that's typically 60% of free disk space (often hundreds of GB), Firefox up to
   2GB+ per origin, Safari 1GB. We cache it in DISK_INFO so sync code (boot log,
   neofetch) can use it, and refresh on boot + when storage pages are opened. */
let DISK_INFO={quota:0,usage:0,ready:false};
async function refreshDiskInfo(){
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const est=await navigator.storage.estimate();
      DISK_INFO.quota=est.quota||0;
      DISK_INFO.usage=est.usage||0;
      DISK_INFO.ready=true;
      /* Try to request persistent storage so the browser doesn't evict our
         uploaded games/wallpapers under disk pressure. */
      if(navigator.storage&&navigator.storage.persist&&!DISK_INFO.persisted){
        try{const p=await navigator.storage.persisted();DISK_INFO.persisted=p;if(!p)navigator.storage.persist().then(v=>{DISK_INFO.persisted=v})}catch(e){}
      }
    }

}

/* === MOBILE DEVICE DETECTION ===
   Detects phones and small tablets via multiple signals:
   - navigator.userAgentData.mobile (Chromium, modern)
   - Classic UA regex (iPhone, Android, Mobile, etc.)
   - Coarse pointer + small screen (fallback for unknown browsers)
   - Touch support + narrow viewport
   The result drives the .mobile class on #shell which triggers mobile-friendly
   CSS overrides: taller taskbar, bigger touch targets, larger desktop icons,
   single-tap-to-open on icons, swipe-to-close windows, no snap layouts, etc. */
let _mobileActive=false;
function isMobileDevice(){
  /* Explicit user override wins */
  if(S.mobileMode==='on')return true;
  if(S.mobileMode==='off')return false;
  /* auto */
  try{
    if(navigator.userAgentData&&typeof navigator.userAgentData.mobile==='boolean')return navigator.userAgentData.mobile;
  }catch(e){}
  const ua=(navigator.userAgent||'').toLowerCase();
  if(/iphone|ipod|android.*mobile|windows phone|blackberry|bb10|opera mini|mobile\s?safari|iemobile|ucbrowser/i.test(ua))return true;
  /* iPad and Android tablets report "Mobile" in Safari UA; check screen + touch */
  const coarse=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
  const narrow=Math.min(window.innerWidth,window.innerHeight)<=600;
  const touch='ontouchstart'in window||navigator.maxTouchPoints>0;
  if(coarse&&narrow&&touch)return true;
  /* Android tablet without "Mobile" in UA: coarse pointer + touch + <=900px wide */
  if(/android/i.test(ua)&&coarse&&touch&&window.innerWidth<=900)return true;
  return false;
}
function applyMobileMode(){

  if(mobile&&(!S.desktopIconSize||S.desktopIconSize==='medium')){S.desktopIconSize='large';save()}

  if(typeof Desktop!=='undefined')Desktop.render();

}

/* === THUMBNAIL DATABASE CACHE ===
   Instead of blindly guessing URLs (which mostly 404), we fetch the ACTUAL
   directory listing from the libretro CDN, parse out all available PNG
   filenames, and do real fuzzy matching against the ROM basename.
   We fetch BOTH Named_Boxarts (box art, preferred) AND Named_Snaps
   (in-game screenshots, fallback for games without box art).
   This roughly doubles the hit rate — many games only have screenshots.
   The listing is ~1MB of HTML per system per directory (~13,000 games
   for NES Boxarts), fetched once per system then cached in memory. */
const _thumbListingCache={};  /* {systemName: Promise<Array<{filename, normalized, dir}>} */
/* Multiple CORS proxies — tried in order. If one fails, the next is tried. */
const CORS_PROXIES=[
  function(url){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(url)},
  function(url){return 'https://corsproxy.io/?'+encodeURIComponent(url)},
  function(url){return 'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(url)},
  function(url){return 'https://cors-anywhere.herokuapp.com/'+url},
];
/* Fetch a single directory listing via CORS proxy, with 15s timeout.
   Tries ALL 4 proxies. Returns array of PNG filenames, or empty array on failure. */
async function fetchListingViaProxy(targetUrl){
  for(let p=0;p<CORS_PROXIES.length;p++){
    const proxyUrl=CORS_PROXIES[p](targetUrl);
    try{
      const controller=new AbortController();
      const timeoutId=setTimeout(()=>controller.abort(),15000);
      const r=await fetch(proxyUrl,{signal:controller.signal});
      clearTimeout(timeoutId);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const html=await r.text();
      if(!html||html.length<1000)throw new Error('Response too small');
      const matches=html.match(/href="([^"]+\.png)"/gi)||[];
      if(matches.length<10)throw new Error('No PNG entries ('+matches.length+')');
      return matches.map(m=>{
        let name=m.match(/href="([^"]+)"/i)[1];
        try{name=decodeURIComponent(name)}catch(e){}
        return name;
      });
    }catch(e){continue}
  }
  return[];
}
/* === INDEXEDDB CACHE FOR THUMBNAIL LISTINGS ===
   The CORS proxies are unreliable — they fail ~50-70% of the time for large
   listings. To fix this, we cache the listing PERMANENTLY in IndexedDB (under
   key 'thumblisting_<systemName>'). Once cached, it's never fetched again —
   even across browser restarts. This means:
   - First time: try all 4 proxies (might take 15-60s, might fail)
   - If it fails: user can click "Fetch missing cover art" again to retry
   - Once it succeeds ONCE: all future lookups for that system are instant
     and never need the proxy again */
async function getCachedListing(systemName){
  const idbKey='thumblisting_'+systemName;
  /* Check IndexedDB first */
  const cached=await IDB.get(idbKey);
  if(cached&&Array.isArray(cached)&&cached.length>0){
    return cached;
  }
  /* Not cached — fetch all three directories in parallel */
  const boxartsUrl='https://thumbnails.libretro.com/'+encodeURIComponent(systemName)+'/Named_Boxarts/';
  const snapsUrl='https://thumbnails.libretro.com/'+encodeURIComponent(systemName)+'/Named_Snaps/';
  const titlesUrl='https://thumbnails.libretro.com/'+encodeURIComponent(systemName)+'/Named_Titles/';
  const [boxartNames,snapNames,titleNames]=await Promise.all([
    fetchListingViaProxy(boxartsUrl),
    fetchListingViaProxy(snapsUrl),
    fetchListingViaProxy(titlesUrl),
  ]);
  /* Merge: Boxarts first (preferred), then Snaps, then Titles */
  const files=[];
  const seen=new Set();
  for(const name of boxartNames){
    const base=name.replace(/\.png$/i,'');
    if(!seen.has(base.toLowerCase())){
      files.push({filename:name,base:base,normalized:normalizeGameName(base),dir:'Named_Boxarts'});
      seen.add(base.toLowerCase());
    }
  }
  for(const name of snapNames){
    const base=name.replace(/\.png$/i,'');
    if(!seen.has(base.toLowerCase())){
      files.push({filename:name,base:base,normalized:normalizeGameName(base),dir:'Named_Snaps'});
      seen.add(base.toLowerCase());
    }
  }
  for(const name of titleNames){
    const base=name.replace(/\.png$/i,'');
    if(!seen.has(base.toLowerCase())){
      files.push({filename:name,base:base,normalized:normalizeGameName(base),dir:'Named_Titles'});
      seen.add(base.toLowerCase());
    }
  }
  /* Only cache if we got at least SOME data — don't cache empty arrays
     (they'd prevent future retries) */
  if(files.length>0){
    await IDB.set(idbKey,files);
  }
  return files;
}
function fetchThumbnailListing(systemName){
  if(_thumbListingCache[systemName])return _thumbListingCache[systemName];
  /* Use IndexedDB-backed cache — persists across browser restarts.
     Falls back to memory cache for the session. */
  _thumbListingCache[systemName]=getCachedListing(systemName);
  return _thumbListingCache[systemName];
}
/* Normalize a game name for fuzzy matching: lowercase, remove all parens,
   brackets, region codes, dump tags, punctuation, and extra spaces.
   "Super Mario Bros. 3 (U) [!]" → "super mario bros 3"
   "Super Mario Bros. 3 (USA)" → "super mario bros 3"
   "Donkey Kong (Japan)" → "donkey kong"
   This lets us match games regardless of naming convention. */
function normalizeGameName(name){
  if(!name)return '';
  let n=name.toLowerCase();
  /* Remove all (...) and [...] groups — region codes, dump tags, revisions */
  n=n.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  /* Remove leading articles for matching (The, A, An) — but keep them for display */
  n=n.replace(/^(the|a|an)\s+/,'');
  /* Remove punctuation that varies between naming conventions */
  n=n.replace(/[.,!?:;'"_-]/g,' ');
  /* Collapse multiple spaces */
  n=n.replace(/\s+/g,' ').trim();
  return n;
}
/* Try to fetch the official box art for a ROM from libretro's thumbnail CDN.
   This uses the DIRECTORY LISTING approach (not URL guessing):
   1. Fetch the full listing of available thumbnails for the system (cached)
   2. Normalize both the ROM name and all listing entries to lowercase,
      no-punctuation, no-region-tags form
   3. Find the closest match (exact normalized match preferred, then
      starts-with match, then contains match)
   4. If found, load the actual image and convert to a data URL
   This works for ALL naming conventions (No-Intro, GoodTools, TOSEC) because
   we normalize everything to the same form before matching. */
function tryFetchGameIcon(basename,core,onFound){
  const systemName=LIBRETRO_SYSTEM_NAMES[core];
  if(!systemName||!basename){return}
  const romNorm=normalizeGameName(basename);
  if(!romNorm){return}
  /* Fetch the listing (cached per-system, fetches BOTH Boxarts + Snaps) */
  fetchThumbnailListing(systemName).then(files=>{
    if(!files||files.length===0){
      tryDirectGuess(basename,systemName,onFound);
      return;
    }
    /* Step 1: Exact normalized match */
    let bestMatch=null;
    for(const f of files){
      if(f.normalized===romNorm){bestMatch=f;break}
    }
    /* Step 2: Starts-with — the ROM name is a prefix of a listing entry.
       Prefer the shortest filename (base game, not hack/variant). */
    if(!bestMatch){
      const startsWith=files.filter(f=>f.normalized.startsWith(romNorm+' ')||f.normalized===romNorm);
      if(startsWith.length>0){
        startsWith.sort((a,b)=>a.filename.length-b.filename.length);
        bestMatch=startsWith[0];
      }
    }
    /* Step 3: Reverse starts-with — the listing entry starts with the ROM name
       (catches "DuckTales" matching "Duck Tales" — wait, those normalize differently).
       Actually this catches cases where the listing has extra words after the
       game title that we stripped during normalization. */
    if(!bestMatch){
      const reverseStartsWith=files.filter(f=>romNorm.startsWith(f.normalized+' ')||romNorm===f.normalized);
      if(reverseStartsWith.length>0){
        reverseStartsWith.sort((a,b)=>b.filename.length-a.filename.length);
        bestMatch=reverseStartsWith[0];
      }
    }
    /* Step 4: Contains — the ROM name appears anywhere in a listing entry. */
    if(!bestMatch){
      const contains=files.filter(f=>f.normalized.indexOf(romNorm)>=0||romNorm.indexOf(f.normalized)>=0);
      if(contains.length===1){
        bestMatch=contains[0];
      }else if(contains.length>1){
        contains.sort((a,b)=>a.filename.length-b.filename.length);
        bestMatch=contains[0];
      }
    }
    /* Step 5: LEVENSHTEIN DISTANCE — find the closest match even if the
       names differ by a few characters (typos, different spelling, missing
       subtitle, etc.). Only accept if the distance is small enough to be
       confident it's the right game. */
    if(!bestMatch&&romNorm.length>=4){
      let bestDist=999,bestEntry=null;
      for(const f of files){
        /* Only compare to entries of similar length — avoids matching
           "tetris" to "teenage mutant ninja turtles" */
        if(Math.abs(f.normalized.length-romNorm.length)>Math.max(5,romNorm.length*0.5))continue;
        const d=levenshtein(romNorm,f.normalized);
        if(d<bestDist){bestDist=d;bestEntry=f}
      }
      /* Only accept if the Levenshtein distance is <= 25% of the ROM name length.
         E.g., for "super mario bros 3" (20 chars), accept distances up to 5.
         This catches minor differences like "&" vs "and", "II" vs "2", etc. */
      if(bestEntry&&bestDist<=Math.max(2,Math.floor(romNorm.length*0.25))){
        bestMatch=bestEntry;
      }
    }
    if(!bestMatch){
      tryDirectGuess(basename,systemName,onFound);
      return;
    }
    /* Found a match! Load the actual image.
       Use bestMatch.dir to know whether it's in Named_Boxarts, Named_Snaps,
       or Named_Titles. If the image fails to load from the matched directory,
       try the SAME filename from the other directories as a fallback —
       the listing might be stale or the file might have been moved. */
    const allDirs=['Named_Boxarts','Named_Snaps','Named_Titles'];
    /* Put the matched dir first, then the others as fallbacks */
    const tryDirs=[bestMatch.dir].concat(allDirs.filter(d=>d!==bestMatch.dir));
    let dirIdx=0;
    function tryLoadImage(){
      if(dirIdx>=tryDirs.length){
        /* All directories failed — fall back to direct guess */
        tryDirectGuess(basename,systemName,onFound);
        return;
      }
      const dir=tryDirs[dirIdx++];
      const url='https://thumbnails.libretro.com/'+encodeURIComponent(systemName)+'/'+dir+'/'+encodeURIComponent(bestMatch.filename);
      const img=new Image();
      img.onload=function(){
        onFound(url);
      };
      img.onerror=function(){
        /* This directory didn't have the image — try the next one */
        tryLoadImage();
      };
      img.src=url;
    }
    tryLoadImage();
  }).catch(()=>{
    /* libretro listing failed — try direct URL guess, then Wikipedia */
    tryDirectGuess(basename,systemName,function(url){
      if(url){onFound(url)}
      else{tryWikipediaFallback(basename,onFound)}
    });
  });
}
/* Levenshtein distance — the minimum number of single-character edits
   (insertions, deletions, substitutions) needed to change one string into
   another. Used for fuzzy game name matching when exact/contains matching
   fails. E.g., "duck tales" vs "ducktales" = distance 1 (insert space). */
function levenshtein(a,b){
  if(a===b)return 0;
  if(!a.length)return b.length;
  if(!b.length)return a.length;
  const m=[];
  for(let i=0;i<=b.length;i++)m[i]=[i];
  for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++){
    for(let j=1;j<=a.length;j++){
      if(b.charAt(i-1)===a.charAt(j-1)){m[i][j]=m[i-1][j-1]}
      else{m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1)}
    }
  }
  return m[b.length][a.length];
}
/* Fallback: if the directory listing approach fails (CDN down, CORS issue,
   etc.), try direct URL guesses. Images load WITHOUT crossOrigin now, so
   this actually works. We try MANY naming variations to maximize hit rate. */
function tryDirectGuess(basename,systemName,onFound){
  const dirs=['Named_Boxarts','Named_Snaps','Named_Titles'];
  const romNorm=normalizeGameName(basename);
  /* Build a comprehensive list of candidate names — the libretro database
     uses inconsistent naming, so we try as many variations as possible.
     Order: most likely first. */
  const candidates=[];
  function add(n){if(n&&candidates.indexOf(n)<0)candidates.push(n)}
  /* Original name as-is (in case it's already in No-Intro format) */
  add(basename);
  /* GoodTools → No-Intro conversions */
  let n=basename.replace(/_/g,' ');
  n=n.replace(/\(JU\)/g,'(Japan, USA)').replace(/\(JUE\)/g,'(Japan, USA, Europe)');
  n=n.replace(/\(UE\)/g,'(USA, Europe)').replace(/\(EU\)/g,'(Europe)');
  n=n.replace(/\(U\)/g,'(USA)').replace(/\(E\)/g,'(Europe)').replace(/\(J\)/g,'(Japan)').replace(/\(W\)/g,'(World)');
  n=n.replace(/\s*\[[^\]]*\]/g,'');  /* strip dump tags */
  add(n);
  /* Try the bare title with each common region tag */
  add(romNorm+' (USA)');
  add(romNorm+' (World)');
  add(romNorm+' (Europe)');
  add(romNorm+' (Japan)');
  add(romNorm+' (Japan, USA)');
  add(romNorm+' (USA, Europe)');
  add(romNorm+' (USA) (Rev 1)');
  add(romNorm+' (World) (Rev A)');
  /* Try without leading "The" / "A" / "An" (common No-Intro convention) */
  const noArticle=romNorm.replace(/^(the|a|an)\s+/,'');
  if(noArticle!==romNorm){
    add(noArticle+' (USA)');
    add(noArticle+' (World)');
    add(noArticle+' (Europe)');
    add(noArticle+' (Japan)');
  }
  let i=0,j=0;
  function tryNext(){
    if(j>=dirs.length){
      /* All direct guesses failed — call onFound with null so the caller
         knows to try the Wikipedia fallback */
      onFound(null);
      return;
    }
    if(i>=candidates.length){i=0;j++;tryNext();return}
    const name=candidates[i++];
    const url='https://thumbnails.libretro.com/'+encodeURIComponent(systemName)+'/'+dirs[j]+'/'+encodeURIComponent(name)+'.png';
    const img=new Image();
    /* NO crossOrigin — the libretro CDN doesn't send CORS headers */
    img.onload=function(){
      onFound(url);
    };
    img.onerror=function(){tryNext()};
    img.src=url;
  }
  tryNext();
}
/* === WIKIPEDIA FALLBACK ===
   If both the libretro directory listing AND the direct URL guesses fail,
   try Wikipedia's API to find a cover art image. Wikipedia is CORS-enabled
   (via origin=* parameter) and has cover art for most notable games.
   
   Approach:
   1. Search Wikipedia for the game name (opensearch API)
   2. Get the article's images (prop=images API)
   3. Find the most likely cover art image (filter for "cover", "box", .png/.jpg)
   4. Get the actual image URL (prop=imageinfo with iiprop=url)
   5. Load the image as an <img> (no crossOrigin — Wikimedia images display fine) */
async function tryWikipediaFallback(gameName,onFound){
  if(!gameName)return;
  try{
    /* Step 1: Search Wikipedia for the game title */
    const cleanName=gameName.replace(/\(.*?\)/g,'').replace(/\[.*?\]/g,'').trim();
    if(!cleanName)return;
    const searchUrl='https://en.wikipedia.org/w/api.php?action=query&format=json&list=search&srsearch='+encodeURIComponent(cleanName+' video game')+'&srlimit=1&origin=*';
    const searchResp=await fetch(searchUrl);
    if(!searchResp.ok)return;
    const searchData=await searchResp.json();
    const searchResults=searchData?.query?.search;
    if(!searchResults||searchResults.length===0)return;
    const pageTitle=searchResults[0].title;
    /* Step 2: Get the article's images */
    const imagesUrl='https://en.wikipedia.org/w/api.php?action=query&format=json&titles='+encodeURIComponent(pageTitle)+'&prop=images&origin=*';
    const imagesResp=await fetch(imagesUrl);
    if(!imagesResp.ok)return;
    const imagesData=await imagesResp.json();
    const pages=imagesData?.query?.pages;
    if(!pages)return;
    /* Step 3: Find the best cover art candidate — prefer files with
       "cover" or "box" in the name, or .png/.jpg files */
    let bestImageFile=null;
    for(const pageId in pages){
      const images=pages[pageId].images||[];
      /* Priority 1: Files with "cover" in the name */
      for(const img of images){
        const t=img.title.toLowerCase();
        if(t.includes('cover')&&t.endsWith('.png')){bestImageFile=img.title;break}
      }
      if(bestImageFile)break;
      /* Priority 2: Files with "box" in the name */
      for(const img of images){
        const t=img.title.toLowerCase();
        if(t.includes('box')&&(t.endsWith('.png')||t.endsWith('.jpg'))){bestImageFile=img.title;break}
      }
      if(bestImageFile)break;
      /* Priority 3: First .png file (often the cover art) */
      for(const img of images){
        if(img.title.toLowerCase().endsWith('.png')&&!img.title.includes('icon')&&!img.title.includes('logo')&&!img.title.includes('symbol')){bestImageFile=img.title;break}
      }
      if(bestImageFile)break;
      /* Priority 4: First .jpg file */
      for(const img of images){
        if(img.title.toLowerCase().endsWith('.jpg')&&!img.title.includes('icon')&&!img.title.includes('logo')){bestImageFile=img.title;break}
      }
    }
    if(!bestImageFile)return;
    /* Step 4: Get the actual image URL from the File: page */
    const infoUrl='https://en.wikipedia.org/w/api.php?action=query&format=json&titles='+encodeURIComponent(bestImageFile)+'&prop=imageinfo&iiprop=url&iiurlwidth=256&origin=*';
    const infoResp=await fetch(infoUrl);
    if(!infoResp.ok)return;
    const infoData=await infoResp.json();
    const infoPages=infoData?.query?.pages;
    if(!infoPages)return;
    for(const pageId in infoPages){
      const imageinfo=infoPages[pageId].imageinfo;
      if(imageinfo&&imageinfo[0]){
        const thumbUrl=imageinfo[0].thumburl||imageinfo[0].url;
        if(thumbUrl){
          /* Step 5: Load the image to verify it exists */
          const img=new Image();
          img.onload=function(){onFound(thumbUrl)};
          img.onerror=function(){};
          img.src=thumbUrl;
          return;
        }
      }
    }
  }catch(e){/* Wikipedia fallback failed silently */}
}
/* === BULK COVER ART FETCH ===
   Scans all desktop ROMs that don't have icons yet and fetches their cover
   art IN PARALLEL (with a concurrency limit to avoid hammering the CDN).
   This is much faster than one-at-a-time fetching when you import a big
   ROM pack — the directory listing is fetched ONCE per system (cached),
   then all ROMs of that system are matched against it instantly.

   Call this from:
   - Game Hub "Fetch missing cover art" button
   - Desktop right-click → "Fetch missing cover art"
   - After a zip import completes (if some icons failed) */
async function fetchAllMissingIcons(){
  /* Collect all desktop ROMs that are missing icons */
  const collectMissing=()=>{
    const list=[];
    const dtop=fsGet(['Desktop']);
    if(dtop&&dtop.children){
      for(const name of Object.keys(dtop.children)){
        const node=dtop.children[name];
        if(node.type==='rom'&&!node.iconData&&LIBRETRO_SYSTEM_NAMES[node.romCore]){
          list.push({name:name.replace(/\.[^.]+$/,''),path:['Desktop',name],node:node,core:node.romCore});
        }
      }
    }
    return list;
  };
  let missing=collectMissing();
  if(missing.length===0){
    Toast.show({icon:'check',title:'All icons found',body:'Every ROM on your desktop already has cover art.'});
    return;
  }
  Toast.show({icon:'download',title:'Fetching cover art',body:'Looking up '+missing.length+' ROM'+(missing.length===1?'':'s')+' missing cover art...'});
  let totalFound=0,totalFailed=0;
  /* Run up to 2 passes — the first pass fetches the directory listings (cached)
     and matches all ROMs. The second pass retries any that failed (transient
     proxy timeouts, image load errors, etc.). The listing is already cached
     from the first pass, so the retry is fast — it just re-matches and
     re-loads the images that failed. */
  const MAX_PASSES=2;
  for(let pass=0;pass<MAX_PASSES;pass++){
    if(missing.length===0)break;
    if(pass>0){
      Toast.show({icon:'refresh',title:'Retrying failed lookups',body:'Pass '+(pass+1)+': retrying '+missing.length+' ROM'+(missing.length===1?'':'s')+' that failed on the first pass...'});
    }
    let found=0,failed=0;
    const CONCURRENCY=5;
    let index=0;
    async function processNext(){
      while(index<missing.length){
        const item=missing[index++];
        try{
          await new Promise(resolve=>{
            tryFetchGameIcon(item.name,item.core,function(iconUrl){
              if(iconUrl){
                const n=fsGet(item.path);
                if(n&&!n.iconData){
                  n.iconData=iconUrl;
                  save();
                  found++;
                  totalFound++;
                }
              }else{
                failed++;
              }
              resolve();
            });
          });
        }catch(e){failed++}
        if(found%5===0&&found>0)Desktop.render();
      }
    }
    const workers=[];
    for(let w=0;w<CONCURRENCY;w++)workers.push(processNext());
    await Promise.all(workers);
    Desktop.render();
    /* Re-collect missing (only ROMs that STILL don't have icons) for the retry pass */
    missing=collectMissing();
  }
  totalFailed=missing.length;
  const parts=[];
  if(totalFound>0)parts.push(totalFound+' cover'+(totalFound===1?'':'s')+' found');
  if(totalFailed>0)parts.push(totalFailed+' not found');
  let extra='';
  if(totalFailed>0){
    extra=' Click "Fetch missing cover art" again to retry (the database listing may still be downloading from the proxy).';
  }
  Toast.show({icon:totalFound>0?'check':'info',title:'Cover art scan complete',body:parts.join(', ')+'.'+extra});
}
function romExt(filename){const m=(filename||'').match(/\.([^.]+)$/);return m?m[1].toLowerCase():''}
function isRomFile(filename){return ROM_CORES.hasOwnProperty(romExt(filename))}
/* === ATARI ST EMULATOR (EstyJS) ===
   Atari ST is NOT supported by EmulatorJS — no hatari WASM core exists on
   their CDN. Instead, we use EstyJS — a pure JavaScript Atari ST emulator
   hosted at kaiec.github.io/EstyJS/.

   This function:
   1. Loads the .st/.msa/.sts ROM data from IndexedDB
   2. Builds an HTML page that loads EstyJS from the GitHub Pages CDN
   3. Uses postMessage to send the ROM data to the iframe (same approach
      as the EmulatorJS ROM loader)
   4. The iframe receives the ROM, creates a File object, and programmatically
      triggers EstyJS's file input handler to load the disk image

   EstyJS supports .st, .msa, and .sts disk image formats. It emulates the
   Atari ST 520/1040 with a 68000 CPU core, floppy disk controller, video

function readRealFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function readRealText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file)})}
function readRealArrayBuffer(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(file)})}
function downscaleImg(dataUrl,maxW,maxH,q){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(!w||!h){res(dataUrl);return}
      const scale=Math.min(1,maxW/w,maxH/h);
      if(scale>=1&&dataUrl.length<900000){res(dataUrl);return}
      const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
      const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,c.width,c.height);
      try{res(c.toDataURL('image/jpeg',q||.86))}catch(e){res(dataUrl)}
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}
async function uploadRealFiles(files,destPath){
  for(const file of files){
    try{
      if(file.type.startsWith('image/')){
        const raw=await readRealFile(file);
        const small=await downscaleImg(raw,1920,1200,.86);
        fsNewNode(destPath,file.name,{type:'image',dataUrl:small,size:Math.round(small.length*.75)});
      }else if(file.type.startsWith('text/')||/\.(txt|md|json|js|css|html|csv|log|xml|yml|ini)$/i.test(file.name)){
        const txt=await readRealText(file);
        fsNewNode(destPath,file.name,{type:'text',content:txt,size:txt.length});
      }else{
        fsNewNode(destPath,file.name,{type:'other',size:file.size,kind:file.type||'unknown'});
        Toast.show({icon:'info',title:file.name,body:'Stored, but Windows 32BIT MAX has no app that can open this file type.'});
      }
    }catch(e){}
  }
  Toast.show({icon:'check',title:'Upload complete',body:files.length+' file(s) added to '+destPath.join('/')+'.'});
}

const WM={
  wins:new Map(),zTop:100,cascade:0,activeId:null,
  area(){const L=shellLocal();return{w:L.w,h:L.h- (S.autoHideTaskbar?0:TB_H)}},
  open(appId,arg){
    const app=APPS[appId];if(!app)return null;
    if(S.uninstalled.includes(appId)&&!app.core){Toast.show({icon:'error',title:'App unavailable',body:app.name+' is not installed. Reinstall it from MAX Store.'});return null}
    if(app.single){for(const w of WM.wins.values())if(w.appId===appId){if(arg!==undefined&&app.onArg)app.onArg(w,arg);if(w.minned)WM.restore(w);WM.focus(w);return w}}
    const A=WM.area();
    /* On mobile, open windows maximized to fill the small screen instead of
       being a 760px window on a 375px phone. The create() call below handles
       the maximized state via the autoMax flag. */
    if(_mobileActive){
      return WM.create({appId,title:app.name,icon:app.icon,w:A.w,h:A.h,x:0,y:0,autoMax:true,build:(body,win)=>app.build(body,win,arg),single:app.single,noMax:app.noMax,onClose:app.onClose});
    }
    const wd=Math.min(app.w||760,A.w-20),ht=Math.min(app.h||520,A.h-20);
    const off=(WM.cascade++%8)*26;
    let x=clamp(Math.round((A.w-wd)/2)+off-60,6,Math.max(6,A.w-wd-6));
    let y=clamp(Math.round((A.h-ht)/2)+off-50,6,Math.max(6,A.h-ht-6));
    return WM.create({appId,title:app.name,icon:app.icon,w:wd,h:ht,x,y,build:(body,win)=>app.build(body,win,arg),single:app.single,noMax:app.noMax,onClose:app.onClose});
  },
  create(o){
    const win={id:uid(),appId:o.appId,title:o.title,icon:o.icon,min:false,max:false,x:o.x,y:o.y,w:o.w,h:o.h,onClose:[],onArg:null};
    const el=h('div',{class:'win',style:{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px'}});
    win.el=el;
    const capBtns=h('div',{class:'caps'},
      h('button',{class:'cap cap-min',title:'Minimize',onclick:e=>{e.stopPropagation();WM.minimize(win)}},(()=>{const s=h('span');s.innerHTML=`<svg viewBox="0 0 12 12" width="11" height="11"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.1"/></svg>`;return s})()),
      h('button',{class:'cap cap-max',title:'Maximize',onclick:e=>{e.stopPropagation();WM.toggleMax(win)}},(()=>{const s=h('span');s.innerHTML=`<svg viewBox="0 0 12 12" width="11" height="11"><rect x="1.8" y="1.8" width="8.4" height="8.4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>`;return s})()),
      h('button',{class:'cap cap-x',title:'Close',onclick:e=>{e.stopPropagation();WM.close(win)}},(()=>{const s=h('span');s.innerHTML=`<svg viewBox="0 0 12 12" width="11" height="11"><path d="M1.8 1.8l8.4 8.4M10.2 1.8l-8.4 8.4" stroke="currentColor" stroke-width="1.1"/></svg>`;return s})()));
    const tb=h('div',{class:'win-tb'},iconEl(o.icon,16,'wic'),h('div',{class:'wtitle'},o.title),h('div',{class:'drag'}),capBtns);
    const body=h('div',{class:'win-body'});
    el.append(tb,body);
    /* resize handles */
    for(const dir of['n','s','e','w','ne','nw','se','sw'])el.append(h('div',{class:'rs rs-'+dir,dataset:{dir}}));
    el.addEventListener('pointerdown',()=>WM.focus(win),true);
    WM.wireDrag(win,tb.querySelector('.drag'),tb);
    WM.wireResize(win);
    WM.snapFlyout(win,tb.querySelector('.cap-max'));
    $('#windows').append(el);
    win.body=body;
    if(o.build)o.build(body,win);
    WM.wins.set(win.id,win);
    WM.focus(win);
    /* autoMax: mobile windows open maximized to fill the screen */
    if(o.autoMax){
      win.prev={x:o.x,y:o.y,w:o.w,h:o.h};
      win.max=true;el.classList.add('maxed');
      const A=WM.area();WM.setRect(win,{x:0,y:0,w:A.w,h:A.h});
    }
    Sounds.play('open');
    Taskbar.render();
    return win;
  },
  setRect(win,r){
    if(r.x!==undefined)win.x=r.x;if(r.y!==undefined)win.y=r.y;if(r.w!==undefined)win.w=r.w;if(r.h!==undefined)win.h=r.h;
    const s=win.el.style;
    s.left=win.x+'px';s.top=win.y+'px';s.width=win.w+'px';s.height=win.h+'px';
  },
  focus(win){
    if(!win||!win.el||!WM.wins.has(win.id))return;
    if(win.min||win.minned){win.min=false;win.minned=false;win.el.classList.remove('minned')}
    if(WM.activeId===win.id&&!win.minned){win.el.style.zIndex=++WM.zTop;return}
    WM.activeId=win.id;win.el.style.zIndex=++WM.zTop;
    for(const w of WM.wins.values())w.el.classList.toggle('active',w.id===win.id);
    Taskbar.render();
  },
  topWin(){let best=null;for(const w of WM.wins.values())if(!w.minned&&(!best||+w.el.style.zIndex>+best.el.style.zIndex))best=w;return best},
  close(win){
    win.onClose.forEach(f=>{try{f()}catch(e){}});
    win.el.classList.add('closing');Sounds.play('close');
    setTimeout(()=>{win.el.remove()},150);
    WM.wins.delete(win.id);
    if(WM.activeId===win.id){const t=WM.topWin();if(t)WM.focus(t);else{WM.activeId=null;Taskbar.render()}}
    else Taskbar.render();
  },
  minimize(win){
    win.min=true;win.minned=true;win.el.classList.add('minned');
    const clone=win.el;
    clone.classList.add('win-anim-min');
    setTimeout(()=>{clone.classList.remove('win-anim-min')},210);
    if(WM.activeId===win.id){const t=WM.topWin();if(t)WM.focus(t);else{WM.activeId=null;Taskbar.render()}}
    Taskbar.render();
  },
  restore(win){
    win.min=false;win.minned=false;win.el.classList.remove('minned');WM.focus(win);
  },
  toggleMax(win){
    if(win.max){
      win.max=false;win.el.classList.remove('maxed');
      WM.setRect(win,win.prev);
    }else{
      win.prev={x:win.x,y:win.y,w:win.w,h:win.h};
      win.max=true;win.el.classList.add('maxed');
      const A=WM.area();WM.setRect(win,{x:0,y:0,w:A.w,h:A.h});
    }
  },
  snap(win,f){
    if(win.max)win.el.classList.remove('maxed');
    if(!win.max&&!win.prev)win.prev={x:win.x,y:win.y,w:win.w,h:win.h};
    win.max=false;win.el.classList.remove('maxed');
    const A=WM.area();
    WM.setRect(win,{x:Math.round(f.x*A.w),y:Math.round(f.y*A.h),w:Math.round(f.w*A.w),h:Math.round(f.h*A.h)});
    WM.focus(win);
  },
  wireDrag(win,handle,tb){
    let sx,sy,ox,oy,dragging=false,pid=null;
    handle.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      if(e.target.closest('.caps'))return;
      dragging=true;pid=e.pointerId;handle.setPointerCapture(pid);
      const lp=toLocal(e.clientX,e.clientY);sx=lp.x;sy=lp.y;ox=win.x;oy=win.y;
      if(win.max){ /* unmaximize at cursor */
        const ratio=lp.x/(win.el.offsetWidth||1);
        const pw=win.prev.w,ph=win.prev.h;
        win.max=false;win.el.classList.remove('maxed');
        WM.setRect(win,{x:Math.round(lp.x-pw*ratio),y:Math.max(0,lp.y-16),w:pw,h:ph});
        ox=win.x;oy=win.y;
      }
      win.el.classList.add('dragging');
      tb.style.cursor='grabbing';
    });
    handle.addEventListener('pointermove',e=>{
      if(!dragging)return;
      const lp=toLocal(e.clientX,e.clientY);
      const A=WM.area();
      const nx=ox+lp.x-sx,ny=clamp(oy+lp.y-sy,0,A.h-34);
      WM.setRect(win,{x:nx,y:ny});
      /* edge snap preview */
      const sp=$('#snapPrev');
      let zone=null;
      if(S.snapEdge){
        if(lp.y<=4)zone={x:0,y:0,w:1,h:1};
        else if(lp.x<=4)zone={x:0,y:0,w:.5,h:1};
        else if(lp.x>=A.w-4)zone={x:.5,y:0,w:.5,h:1};
        else if(lp.y>=A.h-4)zone=null;
      }
      if(zone&&S.snapLayouts!==false){sp.style.display='block';sp.style.left=(zone.x*A.w)+'px';sp.style.top=(zone.y*A.h)+'px';sp.style.width=(zone.w*A.w)+'px';sp.style.height=(zone.h*A.h)+'px';win._snapZone=zone}
      else{sp.style.display='none';win._snapZone=null}
    });
    const end=e=>{
      if(!dragging)return;dragging=false;
      try{handle.releasePointerCapture(pid)}catch(err){}
      win.el.classList.remove('dragging');tb.style.cursor='';
      $('#snapPrev').style.display='none';
      if(win._snapZone){WM.snap(win,win._snapZone);win._snapZone=null}
      else{const A=WM.area();win.x=clamp(win.x,-win.w+70,A.w-70);win.y=clamp(win.y,0,A.h-34);WM.setRect(win,{})}
    };
    handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
    tb.addEventListener('dblclick',e=>{if(!e.target.closest('.caps'))WM.toggleMax(win)});
  },
  wireResize(win){
    for(const hd of win.el.querySelectorAll('.rs')){
      let pid=null,dragging=false,dir,sx,sy,ox,oy,ow,oh;
      hd.addEventListener('pointerdown',e=>{
        if(e.button!==0)return;
        dragging=true;dir=hd.dataset.dir;pid=e.pointerId;hd.setPointerCapture(pid);
        const lp=toLocal(e.clientX,e.clientY);sx=lp.x;sy=lp.y;ox=win.x;oy=win.y;ow=win.w;oh=win.h;
        e.stopPropagation();
      });
      hd.addEventListener('pointermove',e=>{
        if(!dragging)return;
        const lp=toLocal(e.clientX,e.clientY);
        const dx=lp.x-sx,dy=lp.y-sy;
        let r={};
        /* Mobile allows smaller minimums so windows fit on phone screens */
        const minW=_mobileActive?240:380,minH=_mobileActive?180:240;
        if(dir.includes('e'))r.w=Math.max(minW,ow+dx);
        if(dir.includes('s'))r.h=Math.max(minH,oh+dy);
        if(dir.includes('w')){const w=Math.max(minW,ow-dx);r.x=ox+(ow-w);r.w=w}
        if(dir.includes('n')){const hh=Math.max(minH,oh-dy);r.y=oy+(oh-hh);r.h=hh}
        WM.setRect(win,r);
      });
      const end=()=>{dragging=false;try{hd.releasePointerCapture(pid)}catch(err){}};
      hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);
    }
  },
  snapFlyout(win,maxBtn){
    let t=null;
    const LAYOUTS=[
      [{x:0,y:0,w:.5,h:1},{x:.5,y:0,w:.5,h:1}],
      [{x:0,y:0,w:.62,h:1},{x:.62,y:0,w:.38,h:1}],
      [{x:0,y:0,w:.38,h:1},{x:.38,y:0,w:.62,h:1}],
      [{x:0,y:0,w:1/3,h:1},{x:1/3,y:0,w:1/3,h:1},{x:2/3,y:0,w:1/3,h:1}],
      [{x:0,y:0,w:.5,h:.5},{x:.5,y:0,w:.5,h:.5},{x:0,y:.5,w:.5,h:.5},{x:.5,y:.5,w:.5,h:.5}],
      [{x:0,y:0,w:.5,h:1},{x:.5,y:0,w:.5,h:.5},{x:.5,y:.5,w:.5,h:.5}],
    ];
    const fly=h('div',{class:'snapfly'});
    LAYOUTS.forEach(lay=>{
      const g=h('div',{class:'snaplay',style:{gridTemplateColumns:lay.length>2&&lay.every(z=>z.h===1)?`repeat(${lay.length},1fr)`:(lay.length===4?'1fr 1fr':'1fr 1fr'),gridTemplateRows:lay.some(z=>z.h<1)?'1fr 1fr':'1fr'}});
      lay.forEach(zone=>g.append(h('div',{onclick:e=>{e.stopPropagation();fly.classList.remove('show');WM.snap(win,zone)}})));
      fly.append(g);
    });
    win.el.append(fly);
    maxBtn.addEventListener('mouseenter',()=>{if(!S.snapLayouts)return;t=setTimeout(()=>{if(win.max)return;fly.classList.add('show')},420)});
    maxBtn.addEventListener('mouseleave',()=>{clearTimeout(t);setTimeout(()=>{if(!fly.matches(':hover'))fly.classList.remove('show')},260)});
    fly.addEventListener('mouseleave',()=>fly.classList.remove('show'));
  }
};
/* ==================== TASKBAR ==================== */
const PINNED=['explorer','browser','gamehub','gl','notepad','terminal','settings'];
const Taskbar={
  render(){
    const c=$('#tbCenter');c.innerHTML='';
    /* start + search + widgets */
    const startBtn=h('button',{class:'tbi',onclick:()=>togglePopup('#startMenu',()=>StartMenu.render())});
    startBtn.innerHTML=APPICON.explorer2?APPICON.explorer2(uid()):'';
    const startLogo=h('span',{class:'ic',html:`<svg viewBox="0 0 48 48" style="width:24px;height:24px;display:block"><defs><linearGradient id="tb1${uid()}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CC2FF"/><stop offset="1" stop-color="#2E7FD8"/></linearGradient></defs><rect x="4" y="4" width="18" height="18" rx="2.5" fill="url(#tb1x)"/><rect x="26" y="4" width="18" height="18" rx="2.5" fill="#7BC7FF"/><rect x="4" y="26" width="18" height="18" rx="2.5" fill="#2F7FD8"/><rect x="26" y="26" width="18" height="18" rx="2.5" fill="#4FA8F0"/></svg>`});
    startBtn.innerHTML='';startBtn.append(startLogo.firstChild);
    startBtn.append(h('span',{class:'tip'},'Start'));
    c.append(startBtn);
    if(S.showSearch){
      const sb=h('button',{class:'tbi',onclick:()=>{togglePopup('#startMenu',()=>StartMenu.render());setTimeout(()=>$('#smSearch')?.focus(),80)}},iconEl('search',20),h('span',{class:'tip'},'Search'));
      c.append(sb);
    }
    for(const id of PINNED){
      if(S.uninstalled.includes(id))continue;
      const app=APPS[id];if(!app||app.trayOnly)continue;
      c.append(this.item(id,app));
    }
    const runningIds=[...new Set([...WM.wins.values()].map(w=>w.appId))].filter(id=>!PINNED.includes(id));
    for(const id of runningIds){
      if(APPS[id]){c.append(this.item(id,APPS[id]));continue}
      /* Synthetic app for windows NOT in the APPS registry (uploaded games
         with appId 'game_<name>', web apps with appId 'webapp_<id>', etc.).
         Previously these were silently skipped by `if(app)`, so running games
         and web apps never appeared in the taskbar. Now we build a minimal
         app-like object from the top-most window's own icon + title. */
      const winsForId=[...WM.wins.values()].filter(w=>w.appId===id);
      if(!winsForId.length)continue;
      const top=winsForId.sort((a,b)=>+b.el.style.zIndex-+a.el.style.zIndex)[0];
      const synthApp={name:top.title||'App',icon:top.icon||'gamepad',single:true,_synthetic:true};
      c.append(this.item(id,synthApp));
    }
    /* left: widgets weather */
    const left=$('#tbLeft');left.innerHTML='';
    if(S.showWidgets){
      const temp=Math.round(22+6*Math.sin(new Date().getHours()/24*Math.PI*2));
      const b=h('button',{id:'tbWidgets',onclick:()=>togglePopup('#widgetsPanel',()=>Widgets.render())});
      b.append(iconEl('sun',22),h('div',{class:'w-t'},h('b',{},temp+'°C'),h('span',{},'MAX City')));
      left.append(b);
    }
    this.tray();
  },
  item(id,app){
    const wins=[...WM.wins.values()].filter(w=>w.appId===id);
    const active=wins.some(w=>w.id===WM.activeId&&!w.minned);
    const tip=h('span',{class:'tip'},app.name);
    if(wins.length){const close=h('button',{class:'tip-close',title:'Close window',onclick:e=>{e.preventDefault();e.stopPropagation();const live=[...WM.wins.values()].filter(w=>w.appId===id);if(live.length)WM.close(live.sort((a,b)=>+b.el.style.zIndex-+a.el.style.zIndex)[0])}},'×');tip.append(close)}
    const b=h('button',{class:'tbi'+(wins.length?' running':'')+(active?' active':'')},iconEl(app.icon,25),tip);
    b.addEventListener('click',()=>{
      const live=[...WM.wins.values()].filter(w=>w.appId===id);
      if(!live.length){
        /* For synthetic apps (games/webapps not in APPS registry), openApp()
           can't relaunch them — just bail (Taskbar.render will remove this
           stale button on the next tick). For real apps, relaunch normally. */
        if(app._synthetic)return;
        openApp(id);return;
      }
      const top=live.sort((a,b2)=>+b2.el.style.zIndex-+a.el.style.zIndex)[0];
      if(top.min||top.minned)WM.restore(top);
      else if(WM.activeId===top.id)WM.minimize(top);
      else WM.focus(top);
    });
    b.addEventListener('auxclick',e=>{if(e.button===1&&!app.single)openApp(id)});
    b.addEventListener('contextmenu',e=>{
      e.preventDefault();e.stopPropagation();
      const items=[{label:app.name,icon:app.icon,disabled:true},'-',
        {label:'Open new window',icon:'plus',disabled:!!app.single,onClick:()=>openApp(id)}];
      if(wins.length)items.push({label:wins.length>1?'Close all windows':'Close window',icon:'x',danger:true,onClick:()=>wins.forEach(w=>WM.close(w))});
      Ctx.show(e.clientX,e.clientY,items);
    });
    return b;
  },
  tray(){
    const cl=$('#trayClock');
    cl.style.display=S.showClock?'':'none';
    cl.innerHTML='';
    cl.append(h('span',{},fmtTime(new Date(),S.clockSeconds)),h('span',{},fmtDateShort()));
    cl.onclick=()=>togglePopup('#notifC',()=>NotifC.render());
    const tc=$('#trayCluster');tc.innerHTML='';
    const netIcon=!S.wifi||S.airplane?'plane':'wifi';
    tc.append(iconEl(netIcon,17),iconEl(S.muted||!S.sounds?'volx':'vol',17),iconEl(S.batteryCharging?'battchg':'batt',17));
    tc.onclick=()=>togglePopup('#quickSet',()=>QuickSet.render());
    tc.title='Network, sound, battery';
    const sd=$('#tbShowDesk');sd.onclick=()=>{for(const w of WM.wins.values())if(!w.minned)WM.minimize(w)};
  }
};
/* ==================== QUICK SETTINGS ==================== */
const QuickSet={
  render(){
    const q=$('#quickSet');q.innerHTML='';
    const tiles=h('div',{id:'qsGrid'});
    const mk=(icon,label,sub,get,set)=>{
      const b=h('button',{class:'qs-tile'+(get()?' on':''),onclick:()=>{set(!get());save();QuickSet.render();Taskbar.render();Sounds.play('click')}},iconEl(icon,18),h('span',{},label),h('span',{style:{fontSize:'10px',opacity:.75,display:get()&&sub?'block':'none'}},sub||''));
      return b;
    };
    tiles.append(
      mk('wifi','Wi-Fi',S.wifiNet,()=>S.wifi&&!S.airplane,v=>{S.wifi=v;if(v)S.airplane=false}),
      mk('bt','Bluetooth',null,()=>S.bluetooth,v=>S.bluetooth=v),
      mk('plane','Airplane mode',null,()=>S.airplane,v=>{S.airplane=v;if(v){S.wifi=false;S.bluetooth=false}}),
      mk('moon','Night light',null,()=>S.nightLight,v=>{S.nightLight=v;applyFilters()}),
      mk('flash','Battery saver',null,()=>S.batterySaver,v=>S.batterySaver=v),
      mk('access','Accessibility',null,()=>false,()=>{togglePopup();openApp('settings','acc-text')})
    );
    const sliderRow=(icon,val,min,max,set,fmt)=>{
      const inp=h('input',{type:'range',min,max,value:val});
      const upd=()=>{inp.style.setProperty('--val',((inp.value-min)/(max-min)*100)+'%')};upd();
      inp.addEventListener('input',()=>{set(+inp.value);upd()});
      return h('div',{class:'qs-slider'},iconEl(icon,18),inp);
    };
    const foot=h('div',{class:'qs-foot'},
      h('div',{id:'qsBatteryRow',style:{display:'flex',alignItems:'center',gap:'8px'}},iconEl(S.batteryCharging?'battchg':'batt',17),h('span',{},Battery.label())),
      h('button',{class:'btn icon',title:'All settings',onclick:()=>{togglePopup();openApp('settings')}},iconEl('settings',16)));
    q.append(tiles,
      sliderRow('sun',S.brightness*100,20,100,v=>{S.brightness=v/100;applyFilters()}),
      sliderRow(S.muted?'volx':'vol',S.volume,0,100,v=>{S.volume=v;Sounds.apply();Sounds.play('click')}),
      foot);
  }
};
/* ==================== NOTIFICATION CENTER ==================== */
const NotifC={
  mOff:0,
  render(){
    const n=$('#notifC');n.innerHTML='';
    n.append(h('div',{id:'ncHead'},h('span',{},'Notifications'),h('button',{onclick:()=>{NOTIFS.length=0;this.render()}},'Clear all')));
    const list=h('div',{id:'ncList'});
    if(!NOTIFS.length)list.append(h('div',{class:'nc-empty'},'No new notifications'));
    for(const nt of NOTIFS){
      list.append(h('div',{class:'nc-item'},iconEl(nt.icon,18),
        h('div',{style:{flex:1}},h('b',{},nt.title),h('p',{},nt.body)),
        h('button',{class:'x',onclick:()=>{const i=NOTIFS.indexOf(nt);if(i>=0)NOTIFS.splice(i,1);this.render()}},iconEl('x',11))));
    }
    n.append(list);
    n.append(this.cal());
  },
  cal(){
    const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()+this.mOff,1);
    const y=d.getFullYear(),m=d.getMonth();
    const first=new Date(y,m,1);const start=first.getDay();
    const days=new Date(y,m+1,0).getDate();
    const prevDays=new Date(y,m,0).getDate();
    const grid=h('div',{id:'ncCalGrid'});
    for(const w of['S','M','T','W','T','F','S'])grid.append(h('div',{class:'wd'},w));
    for(let i=0;i<start;i++)grid.append(h('div',{class:'d dim'},prevDays-start+1+i));
    const today=new Date();
    for(let i=1;i<=days;i++){
      const isT=i===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
      grid.append(h('div',{class:'d'+(isT?' today':'')},i));
    }
    const rem=(7-(start+days)%7)%7;

const Desktop={
  sel:new Set(),_dragged:false,
  cellMetrics(){
    const sizes={small:{ic:32,w:78,h:84},medium:{ic:44,w:90,h:96},large:{ic:58,w:106,h:114}};
    return sizes[S.desktopIconSize]||sizes.medium;
  },
  gridRows(){
    const cont=$('#icons');const m=this.cellMetrics();
    return Math.max(1,Math.floor((cont.clientHeight-8)/m.h));
  },
  /* Grid layout: each icon gets a grid cell {c, r} (column, row).
     - Icons with a stored position (S.iconPos[key] = {c, r}) use it.
     - Icons without a stored position are cascaded column-major
       (top-to-bottom, then next column) into the next free cell.
     - When S.autoArrange is ON, ALL stored positions are ignored and
       icons are force-cascaded into the grid.
     IMPORTANT: dragging an icon onto an OCCUPIED cell does NOT displace
     the occupant — the dragged icon snaps back. Other icons never move. */
  layout(items){
    const rows=this.gridRows();const pos={},used=new Set();
    if(!S.autoArrange&&S.iconPos){
      for(const it of items){
        const p=S.iconPos[it.key];
        if(p&&Number.isInteger(p.c)&&Number.isInteger(p.r)&&p.c>=0&&p.r>=0&&p.r<rows&&!used.has(p.c+':'+p.r)){pos[it.key]={c:p.c,r:p.r};used.add(p.c+':'+p.r)}
      }
    }
    const rest=items.filter(i=>!pos[i.key]);
    let c=0,r=0,i=0;
    while(i<rest.length&&c<500){
      if(r>=rows){r=0;c++}
      if(!used.has(c+':'+r)){pos[rest[i].key]={c,r};used.add(c+':'+r);i++;r++}
      else r++;
    }
    return pos;
  },
  /* Move an icon to grid cell (c, r). If that cell is already occupied by
     another icon, the move is CANCELLED — the dragged icon snaps back to its
     original cell. This is the fix for "if I drag an icon away all the other
     icons move" — now other icons NEVER move when you drag. */
  moveTo(key,c,r){
    const rows=this.gridRows();
    r=Math.max(0,Math.min(rows-1,r));c=Math.max(0,c);
    S.iconPos=S.iconPos||{};
    const old=S.iconPos[key]?{...S.iconPos[key]}:null;
    if(old&&old.c===c&&old.r===r)return;
    /* Check if target cell is occupied by ANOTHER icon */
    const occ=Object.keys(S.iconPos).find(k=>k!==key&&S.iconPos[k]&&S.iconPos[k].c===c&&S.iconPos[k].r===r);
    if(occ){
      /* Occupied — cancel the move. Other icons stay put. */
      Toast.show({icon:'info',title:'Cell occupied',body:'Another icon is already there. Drop on an empty cell instead.'});
      this.render();
      return;
    }
    S.iconPos[key]={c,r};save();this.render();
  },
  render(){

    /* Save scroll position before clearing — prevents the scrollbar from
       snapping back to the left every time render() is called (which happens
       on marquee selection, icon drag, cover art fetch, etc.) */
    const savedScroll=cont?cont.scrollLeft:0;
    cont.innerHTML='';
    const items=[];
    /* Cache the items array on Desktop so the bulk context-menu operations
       (bulk delete, bulk set-icon) can look up items by their key without
       re-rendering. Set before the loop so it's available even if the loop
       throws partway through. */
    this._lastItems=items;
    /* icon-override lookup: check S.iconOverrides first, then node.iconData (FS files).
       This was the game-icon bug: uploaded icons for FS files were stored on
       node.iconData, but the old code only read S.iconOverrides, so they never showed.
       Overrides can be either a string (icon dataURL, legacy) or an object {img,label}. */
    const ovImg=(k,node)=>{
      const o=(S.iconOverrides&&S.iconOverrides[k])||(node&&node.iconData);
      if(!o)return null;
      if(typeof o==='string')return o;
      return o.img||null;
    };
    const ovLabel=(k,def)=>{
      const o=S.iconOverrides&&S.iconOverrides[k];
      if(o&&typeof o==='object'&&o.label)return o.label;
      return def;
    };
    for(const s of SYS_ICONS){
      if(s.app&&S.uninstalled.includes(s.app))continue;
      if(S.hiddenIcons&&S.hiddenIcons[s.key]&&!S.showHidden)continue;
      const o=ovImg(s.key,null);
      items.push({key:s.key,file:null,sys:s,name:ovLabel(s.key,s.name),icon:o||s.icon,custom:!!o,open:()=>{if(s.app)openApp(s.app);else s.open()}});
    }
    for(const wa of WEBAPPS){

          /* Selection is handled entirely in iconPointerDown (pointerdown) so the

function domainBlocksEmbedding(url){

        h('div',{style:{display:'flex',gap:'8px',marginTop:'6px'}},
          h('button',{class:'btn',onclick:()=>reload()},iconEl('refresh',14),'Try again'),
          h('button',{class:'btn pri',onclick:()=>openPopupApp(url,name)},iconEl('open',14),'Open in app window')));

      view.append(iframe,loading,errorOv);

      const wrap=h('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'#fff'}});
      wrap.append(toolbar,view);
      b.append(wrap);

      /* ---- iframe load detection ----
         The OLD Browser code did this:
            setTimeout(check, 3500);
         which falsely flagged any site slower than 3.5s as "refused to connect",
         because contentDocument was still about:blank while loading.
         The NEW approach: wait for the iframe's real `load` event, then check.
         Cross-origin (throws when reading contentDocument) = loaded fine.
         Accessible-but-empty = actually blocked. 20s fallback for non-responding sites. */
      let loaded=false;
      let fallbackT=null;
      const checkBlocked=()=>{
        try{
          const d=iframe.contentDocument;
          /* If doc is accessible AND looks empty/about:blank, the site blocked embedding */
          if(d&&(!d.body||d.body.childElementCount===0||d.location.href==='about:blank')){
            loading.style.display='none';
            errorOv.style.display='flex';
            return true;
          }
          /* If accessible and has content, OR throws below = loaded fine */
        }catch(e){/* cross-origin = loaded fine */}
        loading.style.display='none';
        loaded=true;
        if(fallbackT){clearTimeout(fallbackT);fallbackT=null}
        return false;
      };
      iframe.addEventListener('load',()=>{
        /* Give the page a moment to render before checking */
        setTimeout(checkBlocked,300);
      });
      const reload=()=>{
        loaded=false;
        loading.style.display='flex';
        errorOv.style.display='none';
        iframe.src=url;
        if(fallbackT)clearTimeout(fallbackT);
        fallbackT=setTimeout(()=>{
          if(!loaded){
            loading.style.display='none';
            errorOv.style.display='flex';
          }
        },20000);
      };
      reloadBtn.addEventListener('click',reload);
      openBtn.addEventListener('click',()=>openPopupApp(url,name));

      /* Initial 20s fallback in case load event never fires (very slow / hung sites) */
      fallbackT=setTimeout(()=>{
        if(!loaded){
          loading.style.display='none';
          errorOv.style.display='flex';
        }
      },20000);
    }
  });
}
function openFile(path,node){
  if(node.type==='folder')openApp('explorer',path);
  else if(node.type==='text')openApp('notepad',path);
  else if(node.type==='image')openApp('photos',path);
  else if(node.type==='web')openWebApp({name:k0(path).replace(/\.url$/i,''),url:node.url},node.iconData||null);
  else if(node.type==='game')openGameFile(path,node);
  else if(node.type==='rom')openRomFile(path,node);
  else Toast.show({icon:'info',title:'Windows 32BIT MAX',body:'No app can open this file type.'});
}

      Sounds.play('click');
      if(/^[0-9]$/.test(k)){st.cur=st.fresh||st.cur==='0'?k:st.cur+k;st.fresh=false}
      else if(k==='.'){if(st.fresh){st.cur='0.';st.fresh=false}else if(!st.cur.includes('.'))st.cur+='.'}
      else if(k==='C'){st.cur='0';st.acc=null;st.op=null;st.fresh=true;st.hist=''}
      else if(k==='CE'){st.cur='0';st.fresh=true}
      else if(k==='⌫'){st.cur=st.cur.length>1?st.cur.slice(0,-1):'0'}
      else if(k==='±'){st.cur=st.cur.startsWith('-')?st.cur.slice(1):'-'+st.cur}
      else if(k==='√'){st.cur=String(Math.sqrt(parseFloat(st.cur)))}
      else if(k==='x²'){st.cur=String(parseFloat(st.cur)**2)}
      else if(k==='1/x'){st.cur=parseFloat(st.cur)===0?'Cannot divide by zero':String(1/parseFloat(st.cur))}
      else if(k==='%'){st.cur=String(parseFloat(st.cur)/100)}
      else if(k==='='){
        if(st.op&&st.acc!==null){const r=calc();st.hist=st.acc+' '+st.op+' '+st.cur+' =';st.cur=isFinite(r)?String(+r.toPrecision(14)):'Cannot divide by zero';st.acc=null;st.op=null;st.fresh=true}
      }else{ /* operator */
        if(st.op&&st.acc!==null&&!st.fresh){const r=calc();st.cur=isFinite(r)?String(+r.toPrecision(14)):'0'}
        st.acc=st.cur;st.op=k;st.fresh=true;st.hist=st.cur+' '+k;
      }
      show();
    };
    const keys=['%','CE','C','⌫','1/x','x²','√','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];
    keys.forEach(k=>{
      const cls=k==='='?'eq':(/^[0-9.]$/.test(k)?'num':'');
      grid.append(h('button',{class:cls,onclick:()=>press(k)},k));
    });
    win.keyHandler=e=>{
      const map={'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','.':'.','%':'%'};
      if(/^[0-9]$/.test(e.key))press(e.key);
      else if(map[e.key]){e.preventDefault();press(map[e.key])}
    };
    show();
  }
};

APPS.paint={name:'Paint',icon:'paint',w:940,h:640,
  build(body,win){
    const root=h('div',{class:'pt'});
    const CW=1100,CH=680;
    const canvas=h('canvas',{width:CW,height:CH});
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,CW,CH);

    const st={tool:'pencil',color:'#000000',size:4,drawing:false,lx:0,ly:0,undo:[],redo:[],startX:0,startY:0,snap:null};
    const pushUndo=()=>{st.undo.push(canvas.toDataURL());if(st.undo.length>18)st.undo.shift();st.redo.length=0};

    const tg1=h('div',{class:'grp'},mkTool('pencil','Pencil','brush'),mkTool('eraser','Eraser','x'),mkTool('fill','Fill','palette'),mkTool('line','Line','edit'),mkTool('rect','Rectangle','grid'),mkTool('ellipse','Ellipse','info'));
    const sizeInp=h('input',{type:'range',min:1,max:40,value:4,style:{width:'90px'},oninput:e=>{st.size=+e.target.value;e.target.style.setProperty('--val',((e.target.value-1)/39*100)+'%');sizeLbl.textContent=e.target.value+' px'}});
    sizeInp.style.setProperty('--val','8%');

      colors.append(b);
    });
    colors.append(h('input',{type:'color',value:st.color,oninput:e=>{st.color=e.target.value}}));
