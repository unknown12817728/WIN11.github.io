{id:'reaction',title:'Reaction Time Test',desc:'Wait for green, then click as fast as you can. Measures your reflexes in milliseconds.',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reaction Test</title><style>html,body{height:100%;margin:0;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;user-select:none}#box{width:400px;height:300px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;cursor:pointer;text-align:center;padding:20px;transition:background .2s}#box.wait{background:#ef4444;color:#fff}#box.go{background:#22c55e;color:#fff}#box.tooearly{background:#f59e0b;color:#1a1a1a}#box.result{background:#3b82f6;color:#fff}b{font-size:22px}.stats{font-size:14px;color:#666}button{background:#3b82f6;border:0;border-radius:8px;padding:8px 20px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}</style></head><body><b>Reaction Time Test</b><div id="box" class="wait" onclick="click()">Click here to start</div><div class="stats">Best: <span id="best">—</span> ms · Average: <span id="avg">—</span> ms · Tries: <span id="tries">0</span></div><button onclick="reset()">Reset stats</button><script>
var state='idle',startT=0,times=[];
function setText(t,cls){var b=document.getElementById('box');b.textContent=t;b.className=cls}
function start(){state='wait';setText('Wait for green...','wait');var delay=1500+Math.random()*3500;setTimeout(function(){if(state=='wait'){state='go';setText('CLICK!','go');startT=Date.now()}},delay)}
function click(){if(state=='idle'||state=='result'){start();return}if(state=='wait'){state='tooearly';setText('Too early! Click to try again','tooearly');return}if(state=='go'){var t=Date.now()-startT;times.push(t);state='result';setText(t+' ms — click to try again','result');var avg=Math.round(times.reduce(function(a,b){return a+b},0)/times.length);var best=Math.min.apply(null,times);document.getElementById('best').textContent=best;document.getElementById('avg').textContent=avg;document.getElementById('tries').textContent=times.length}}
function reset(){times=[];state='idle';setText('Click here to start','wait');document.getElementById('best').textContent='—';document.getElementById('avg').textContent='—';document.getElementById('tries').textContent=0}
<\/script></body></html>`},
{id:'aimtrainer',title:'Aim Trainer',desc:'Click 30 targets as fast as you can. Measures your speed and accuracy.',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Aim Trainer</title><style>html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;user-select:none}#arena{width:600px;height:420px;background:#1e293b;border-radius:12px;position:relative;overflow:hidden;cursor:crosshair}.target{position:absolute;width:44px;height:44px;border-radius:50%;background:#ef4444;border:3px solid #fff;box-shadow:0 0 12px rgba(239,68,68,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}.target:hover{transform:scale(1.1)}b{font-size:18px}.stats{font-size:15px;color:#94a3b8}button{background:#3b82f6;border:0;border-radius:8px;padding:10px 24px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}</style></head><body><b>Aim Trainer</b><div class="stats">Targets: <span id="hit">0</span>/30 · Time: <span id="t">0.00</span>s · Accuracy: <span id="acc">100</span>%</div><div id="arena" onclick="miss(event)"></div><button onclick="start()">Start</button><script>
var arena,timer,hit=0,misses=0,startT=null,total=30,playing=false;
function start(){arena=document.getElementById('arena');arena.innerHTML='';hit=0;misses=0;playing=true;document.getElementById('hit').textContent=0;document.getElementById('acc').textContent=100;startT=Date.now();timer=setInterval(function(){document.getElementById('t').textContent=((Date.now()-startT)/1000).toFixed(2)},50);spawn()}
function spawn(){if(!playing)return;if(hit>=total){playing=false;clearInterval(timer);var t=((Date.now()-startT)/1000).toFixed(2);alert('Done! '+total+' targets in '+t+'s. Accuracy: '+Math.round(total/(total+misses)*100)+'%');return}var t=document.createElement('div');t.className='target';t.textContent=hit+1;t.style.left=Math.random()*(arena.offsetWidth-50)+'px';t.style.top=Math.random()*(arena.offsetHeight-50)+'px';t.onclick=function(e){e.stopPropagation();hit++;document.getElementById('hit').textContent=hit;document.getElementById('acc').textContent=Math.round(hit/(hit+misses)*100);this.remove();spawn()};arena.appendChild(t)}
function miss(e){if(!playing)return;if(e.target==arena){misses++;document.getElementById('acc').textContent=Math.round(hit/(hit+misses)*100)}}
<\/script></body></html>`},
{id:'higherlower',title:'Higher or Lower',desc:'Guess if the next card is higher or lower than the current one. Build a streak!',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Higher or Lower</title><style>html,body{height:100%;margin:0;background:#0f5132;color:#fff;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;user-select:none}.card{width:120px;height:168px;border-radius:12px;background:#fff;color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:48px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.4)}.card.r{color:#dc2626}b{font-size:22px}.streak{font-size:18px;color:#fbbf24}button{background:#fbbf24;border:0;border-radius:10px;padding:12px 32px;color:#1a1a1a;font-size:16px;font-weight:700;cursor:pointer;margin:0 6px}button:disabled{opacity:.4}.btns{display:flex;gap:4px}</style></head><body><b>Higher or Lower</b><div class="streak">Streak: <span id="streak">0</span> · Best: <span id="best">0</span></div><div class="card" id="card">?</div><div class="btns"><button id="higher" onclick="guess(true)">⬆ Higher</button><button id="lower" onclick="guess(false)">⬇ Lower</button></div><button onclick="newGame()" style="background:#3b82f6;color:#fff">New game</button><div id="msg"></div><script>
var cur=null,streak=0,best=0,playing=false;
function rndCard(){var suits=['♠','♥','♦','♣'];var v=Math.floor(Math.random()*13)+1;var s=suits[Math.floor(Math.random()*4)];return{v,s}}
function cardHTML(c){var v=c.v==1?'A':c.v>10?['J','Q','K'][c.v-11]:c.v;var red=c.s=='♥'||c.s=='♦';var el=document.getElementById('card');el.innerHTML=v+'<br>'+c.s;el.className='card'+(red?' r':'')}
function newGame(){cur=rndCard();cardHTML(cur);streak=0;document.getElementById('streak').textContent=0;document.getElementById('best').textContent=best;document.getElementById('msg').textContent='';document.getElementById('higher').disabled=false;document.getElementById('lower').disabled=false;playing=true}
function guess(higher){if(!playing)return;var next=rndCard();var correct=higher?next.v>cur.v:next.v<cur.v;if(next.v==cur.v)correct=false;cardHTML(next);if(correct){streak++;document.getElementById('streak').textContent=streak;if(streak>best){best=streak;document.getElementById('best').textContent=best}document.getElementById('msg').textContent='Correct!'}else{document.getElementById('msg').textContent='Wrong! The card was '+(next.v>cur.v?'higher':'lower');playing=false;document.getElementById('higher').disabled=true;document.getElementById('lower').disabled=true}cur=next}
newGame();
<\/script></body></html>`},
{id:'conway',title:'Game of Life',desc:'Conway\'s cellular automaton. Click cells to toggle, press Play, watch life evolve.',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Game of Life</title><style>html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none}canvas{border:2px solid #334;border-radius:8px;background:#0a0f1a;cursor:pointer}b{font-size:18px}.info{font-size:14px;color:#94a3b8}button{background:#3b82f6;border:0;border-radius:8px;padding:8px 16px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin:0 4px}button.on{background:#22c55e}</style></head><body><b>Conway\'s Game of Life</b><div class="info">Generation: <span id="gen">0</span> · Population: <span id="pop">0</span></div><canvas id="c" width="600" height="400"></canvas><div><button id="playBtn" onclick="togglePlay()">▶ Play</button><button onclick="step()">Step</button><button onclick="randomize()">🎲 Random</button><button onclick="clearGrid()">Clear</button></div><script>
var cv=document.getElementById('c'),x=cv.getContext('2d'),S=10,CW=60,CH=40,grid=[],gen=0,playing=false;
for(var r=0;r<CH;r++){grid[r]=[];for(var c=0;c<CW;c++)grid[r][c]=0}
function draw(){x.fillStyle='#0a0f1a';x.fillRect(0,0,600,400);for(var r=0;r<CH;r++)for(var c=0;c<CW;c++){if(grid[r][c]){x.fillStyle='#22c55e';x.fillRect(c*S,r*S,S-1,S-1)}else{x.strokeStyle='rgba(255,255,255,.03)';x.strokeRect(c*S,r*S,S,S)}}var pop=0;for(var r=0;r<CH;r++)for(var c=0;c<CW;c++)if(grid[r][c])pop++;document.getElementById('pop').textContent=pop;document.getElementById('gen').textContent=gen}
function step(){var ng=[];for(var r=0;r<CH;r++){ng[r]=[];for(var c=0;c<CW;c++){var n=0;for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr==0&&dc==0)continue;var rr=(r+dr+CH)%CH,cc=(c+dc+CW)%CW;if(grid[rr][cc])n++}if(grid[r][c])ng[r][c]=n==2||n==3?1:0;else ng[r][c]=n==3?1:0}}grid=ng;gen++;draw()}
function togglePlay(){playing=!playing;document.getElementById('playBtn').textContent=playing?'⏸ Pause':'▶ Play';document.getElementById('playBtn').classList.toggle('on',playing);if(playing)run()}
function run(){if(!playing)return;step();setTimeout(run,120)}
cv.addEventListener('click',function(e){var rect=cv.getBoundingClientRect();var c=Math.floor((e.clientX-rect.left)/S),r=Math.floor((e.clientY-rect.top)/S);if(r>=0&&r<CH&&c>=0&&c<CW){grid[r][c]=!grid[r][c];draw()}});
function randomize(){for(var r=0;r<CH;r++)for(var c=0;c<CW;c++)grid[r][c]=Math.random()<.3?1:0;gen=0;draw()}
function clearGrid(){for(var r=0;r<CH;r++)for(var c=0;c<CW;c++)grid[r][c]=0;gen=0;draw()}
/* Glider gun pattern */grid[5][1]=1;grid[5][2]=1;grid[6][1]=1;grid[6][2]=1;grid[5][11]=1;grid[6][11]=1;grid[7][11]=1;grid[4][12]=1;grid[8][12]=1;grid[3][13]=1;grid[9][13]=1;grid[3][14]=1;grid[9][14]=1;grid[6][15]=1;grid[4][16]=1;grid[8][16]=1;grid[5][17]=1;grid[6][17]=1;grid[7][17]=1;grid[6][18]=1;grid[3][21]=1;grid[4][21]=1;grid[5][21]=1;grid[3][22]=1;grid[4][22]=1;grid[5][22]=1;grid[2][23]=1;grid[6][23]=1;grid[1][25]=1;grid[2][25]=1;grid[6][25]=1;grid[7][25]=1;grid[3][35]=1;grid[4][35]=1;grid[3][36]=1;grid[4][36]=1;
draw();
<\/script></body></html>`},
{id:'maze',title:'Maze Runner',desc:'Navigate a randomly generated maze to reach the green exit. Arrow keys to move.',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Maze Runner</title><style>html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none}canvas{border:2px solid #334;border-radius:8px;background:#1e293b}b{font-size:18px}.info{font-size:14px;color:#94a3b8}button{background:#3b82f6;border:0;border-radius:8px;padding:8px 20px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}</style></head><body><b>Maze Runner</b><div class="info">Moves: <span id="mv">0</span> — Level: <span id="lv">1</span></div><canvas id="c" width="500" height="500"></canvas><button onclick="newMaze()">New maze</button><script>
var cv=document.getElementById('c'),x=cv.getContext('2d'),N=25,S=20;
var grid=[],px=0,py=0,ex=N-1,ey=N-1,moves=0,lv=1,won=false;
function gen(){grid=[];for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++)grid[r][c]={walls:[true,true,true,true],visited:false}}function carve(r,c){grid[r][c].visited=true;var dirs=[[0,1,1,3],[0,-1,3,1],[1,0,2,0],[-1,0,0,2]].sort(function(){return Math.random()-.5});for(var d of dirs){var nr=r+d[0],nc=c+d[1];if(nr>=0&&nc>=0&&nr<N&&nc<N&&!grid[nr][nc].visited){grid[r][c].walls[d[2]]=false;grid[nr][nc].walls[d[3]]=false;carve(nr,nc)}}}carve(0,0);px=0;py=0;moves=0;won=false;document.getElementById('mv').textContent=0;draw()}
function canGo(r,c,dir){return!grid[r][c].walls[dir]}
addEventListener('keydown',function(e){if(won)return;var dx=0,dy=0,dir=-1;if(e.key=='ArrowRight'){dx=1;dir=1}if(e.key=='ArrowLeft'){dx=-1;dir=3}if(e.key=='ArrowDown'){dy=1;dir=2}if(e.key=='ArrowUp'){dy=-1;dir=0}if(dir<0)return;e.preventDefault();var nx=px+dx,ny=py+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&canGo(py,px,dir)){px=nx;py=ny;moves++;document.getElementById('mv').textContent=moves;draw();if(px==ex&&py==ey){won=true;setTimeout(function(){alert('You escaped in '+moves+' moves!');lv++;document.getElementById('lv').textContent=lv;N=25;newMaze()},100)}}});
function draw(){x.fillStyle='#1e293b';x.fillRect(0,0,N*S,N*S);for(var r=0;r<N;r++)for(var c=0;c<N;c++){var cell=grid[r][c];var cx=c*S,cy=r*S;x.strokeStyle='#475569';x.lineWidth=2;if(cell.walls[0]){x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+S,cy);x.stroke()}if(cell.walls[1]){x.beginPath();x.moveTo(cx+S,cy);x.lineTo(cx+S,cy+S);x.stroke()}if(cell.walls[2]){x.beginPath();x.moveTo(cx,cy+S);x.lineTo(cx+S,cy+S);x.stroke()}if(cell.walls[3]){x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,cy+S);x.stroke()}}x.fillStyle='#22c55e';x.fillRect(ex*S+4,ey*S+4,S-8,S-8);x.fillStyle='#3b82f6';x.beginPath();x.arc(px*S+S/2,py*S+S/2,S/2-3,0,7);x.fill()}
function newMaze(){gen()}
gen();
<\/script></body></html>`},
{id:'lightcycles',title:'Light Cycles',desc:'Tron-style! Ride your bike and leave a trail. Trap the AI into hitting your wall.',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Light Cycles</title><style>html,body{height:100%;margin:0;background:#000;color:#0ff;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;user-select:none;overflow:hidden}canvas{border:1px solid #0ff;border-radius:8px}b{font-size:18px}small{color:#089}</style></head><body><b>Light Cycles — Score: <span id="s">0</span></b><canvas id="c" width="500" height="500"></canvas><small>Arrow keys · trap the orange bike · don't hit walls or trails</small><script>
var cv=document.getElementById('c'),x=cv.getContext('2d'),N=50,S=10;
var grid=[],p1={x:10,y:25,dx:1,dy:0,color:'#0ff'},p2={x:40,y:25,dx:-1,dy:0,color:'#f80'},over=false,score=0;
addEventListener('keydown',function(e){if(e.key=='ArrowLeft'&&p1.dx!=1){p1.dx=-1;p1.dy=0}if(e.key=='ArrowRight'&&p1.dx!=-1){p1.dx=1;p1.dy=0}if(e.key=='ArrowUp'&&p1.dy!=1){p1.dx=0;p1.dy=-1}if(e.key=='ArrowDown'&&p1.dy!=-1){p1.dx=0;p1.dy=1}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)>=0)e.preventDefault()});
function reset(){grid=[];for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++)grid[r][c]=0}p1={x:10,y:25,dx:1,dy:0,color:'#0ff'};p2={x:40,y:25,dx:-1,dy:0,color:'#f80'};over=false;x.fillStyle='#000';x.fillRect(0,0,500,500)}
function step(){p1.x+=p1.dx;p1.y+=p1.dy;p2.x+=p2.dx;p2.y+=p2.dy;var p1dead=p1.x<0||p1.y<0||p1.x>=N||p1.y>=N||grid[p1.y][p1.x];var p2dead=p2.x<0||p2.y<0||p2.x>=N||p2.y>=N||grid[p2.y][p2.x];if(grid[p1.y]&&grid[p1.y][p1.x])p1dead=true;if(grid[p2.y]&&grid[p2.y][p2.x])p2dead=true;if(p1dead&&p2dead){endGame('Draw!');return}if(p1dead){endGame('You crashed!');return}if(p2dead){score++;document.getElementById('s').textContent=score;endGame('You win!');return}grid[p1.y][p1.x]=1;grid[p2.y][p2.x]=2;x.fillStyle=p1.color;x.fillRect(p1.x*S,p1.y*S,S,S);x.fillStyle=p2.color;x.fillRect(p2.x*S,p2.y*S,S,S);if(Math.random()<.3){var dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){var nx=p2.x+d[0],ny=p2.y+d[1];return nx>=0&&ny>=0&&nx<N&&ny<N&&!grid[ny][nx]});if(dirs.length){var d=dirs[Math.floor(Math.random()*dirs.length)];p2.dx=d[0];p2.dy=d[1]}}}
function endGame(msg){over=true;setTimeout(function(){if(confirm(msg+' Play again?')){reset()}},100)}
function loop(){if(!over){step()}requestAnimationFrame(loop)}setInterval(loop,60);reset();
<\/script></body></html>`},
{id:'dodge',title:'Dodge Block',desc:'Dodge incoming blocks for as long as possible. They speed up over time. Survive!',html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dodge Block</title><style>html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;user-select:none;overflow:hidden}canvas{border:2px solid #334;border-radius:8px;background:#1e293b}b{font-size:18px}small{color:#666}</style></head><body><b>Dodge — Time: <span id="s">0.0</span>s</b><canvas id="c" width="440" height="440"></canvas><small>Arrow keys · dodge red blocks</small><script>
var cv=document.getElementById('c'),x=cv.getContext('2d'),W=440,H=440;

/* ==================== GAME HUB APP ==================== */
/* data can be a string (built-in game template) or an ArrayBuffer (uploaded file).
   ArrayBuffers preserve the original file bytes including encoding — critical for
   games saved in Windows-1252 / ISO-8859-1 that would be corrupted by readAsText. */
async function saveGameFile(name,data){
  const size=typeof data==='string'?data.length:(data&&data.byteLength)||0;
  /* All uploaded games go to IndexedDB. IndexedDB uses the real device storage
     quota (via navigator.storage.estimate), which on desktop Chrome is typically
     60% of free disk space — often hundreds of GB. localStorage caps at ~5-10MB,
     so storing games there would silently truncate them. */
  let key='game_'+name+'_'+Date.now();
  const ok=await IDB.set(key,data);
  const node={type:'game',size};
  if(ok)node.idbKey=key;else node.html=data;
  fsNewNode(['Desktop'],name+'.html',node);
  Desktop.render();
}
/* Save a ROM file (.nes, .smc, .sfc, .gb, .gbc, .gba, .iso, .chd, .pbp, .bin, .cue).
   ROMs are stored as type 'rom' with their emulator core recorded, so openRomFile
   knows which RetroArch WASM core to boot. Data goes to IndexedDB (NES ROMs are
   ~256KB-4MB, PS1 games are ~100-700MB — IndexedDB handles both via real device
   storage quota). */
async function saveRomFile(filename,data){
  const ext=romExt(filename);
  const core=ROM_CORES[ext];
  if(!core){Toast.show({icon:'error',title:'Unsupported ROM',body:'.'+ext+' is not a supported ROM format. See Game Hub for the full list of supported consoles.'});return}
  const baseName=filename.replace(/\.(nes|unf|unif|fds|smc|sfc|fig|swc|gb|sgb|gbc|gba|nds|3ds|cia|cxi|cci|vb|vboy|z64|n64|v64|iso|bin|cue|chd|pbp|cso|prx|gg|sms|md|gen|smd|32x|cdi|gdi|a26|a52|a78|lnx|lyx|j64|jag|st|msa|sts|ipf|dim|exe|com|bat|jsdos|vhd|hdi|hdm|ws|wsc|ngp|ngc|vec|col|zip|prg|d64|t64|tap|crt|g64|d71|d81|d80|d20|adf|adz|hdf|hdz|lha|lzx|dms|ipf|fs)$/i,'');
  const size=(data&&data.byteLength)||0;
  let key='rom_'+baseName+'_'+Date.now();
  const ok=await IDB.set(key,data);
  const node={type:'rom',romCore:core,size};
  if(ok)node.idbKey=key;else node.romData=data;
  /* Save the file to the Desktop — first with the default gamepad icon,
     so the user sees it appear immediately. */
  const savedName=fsNewNode(['Desktop'],baseName+'.'+ext,node);
  Desktop.render();
  /* === AUTO-FETCH OFFICIAL GAME COVER ART ===
     Now kick off an async lookup on the libretro thumbnail CDN. If found,
     attach it as the icon (node.iconData) and re-render. The user sees the
     icon update from the generic gamepad to the actual game's box art
     within a second or two. This is best-effort — if the lookup fails
     (game not in the database, or offline), the icon stays as gamepad. */
  if(LIBRETRO_SYSTEM_NAMES[core]&&savedName){
    /* Track whether onFound was called — if not after a reasonable timeout,
       we know the lookup failed (all candidates 404'd). */
    let iconFound=false;
    tryFetchGameIcon(baseName,core,function(iconUrl){
      iconFound=true;
      /* Re-fetch the node from the filesystem (in case it changed) and
         attach the icon. Then save + re-render. */
      const n=fsGet(['Desktop',savedName]);
      if(n){
        n.iconData=iconUrl;
        save();
        Desktop.render();
        Toast.show({icon:'image',title:'Cover art found',body:baseName+' — official box art applied as icon.'});
      }
    });
    /* After 15 seconds (enough time for listing fetch + image load), if no
       icon was found, show a concise toast. The listing-based approach is
       much more reliable, so if this fails, the game genuinely isn't in the
       libretro database. */
    setTimeout(function(){
      if(!iconFound){
        Toast.show({icon:'info',title:'No cover art',body:baseName+' — not found in the libretro database. Right-click → Properties → Upload icon to set one manually.'});
      }
    },15000);
  }
}

    const iaSearch=h('input',{class:'inp',id:'iaSearchInput',placeholder:'Search homebrew & free games (e.g. "SNES homebrew")',style:{flex:'0 0 auto',width:'260px'},onkeydown:e=>{if(e.key==='Enter')searchIA()}});

/* === RECURSIVE ARCHIVE EXTRACTION (ZIP + 7Z) ===
   Wait for fflate / 7z-wasm to be loaded (deferred via CDN), then extract
   an archive buffer. Returns a Promise resolving to {name: Uint8Array}.
   Recursive — if an entry is itself a .zip/.7z, it extracts that too,
   until all the leaf files (ROMs, HTML games) are surfaced.
   NOTE: fflate's UMD build exposes the global as `fflate` (two f's). */
function waitForLib(globalName,label){
  return new Promise((res,rej)=>{
    if(window[globalName])return res(window[globalName]);
    let tries=0;
    const iv=setInterval(()=>{
      if(window[globalName]){clearInterval(iv);res(window[globalName])}
      else if(++tries>80){clearInterval(iv);rej(new Error(label+' library failed to load from CDN'))}
    },100);
  });
}
/* Unzip a ZIP archive using fflate. Returns {name: Uint8Array}. */
async function unzipBuffer(buf){
  const flate=await waitForLib('fflate','fflate');
  const input = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  return new Promise((res,rej)=>{
    try{
      flate.unzip(input,(err,files)=>{
        if(err)rej(err);else res(files);
      });
    }catch(e){rej(e)}
  });
}
/* Extract a 7Z archive using 7z-wasm. Returns {name: Uint8Array}.
   The 7z-wasm API is Emscripten-based: SevenZip is a factory function
   that returns a Promise<Module>. We then:
   1. Write the .7z bytes to the module's virtual filesystem
   2. Run `7zz x archive.7z` (extract all) via callMain
   3. Read all extracted files back from the virtual filesystem
   4. Return them as {name: Uint8Array}
   The module is cached in __sevenZipModule so subsequent extractions are fast. */
let __sevenZipModule=null;
async function un7zBuffer(buf){
  if(!window.SevenZip)throw new Error('7z-wasm library (SevenZip global) not loaded yet. Check your internet connection — the library loads from cdn.jsdelivr.net.');
  /* Create a FRESH module instance for each extraction — Emscripten's callMain
     can only be called ONCE per module. If we reuse a cached module, the
     second extraction silently fails and produces zero files.
     This is slower (~250KB WASM re-init per extraction) but reliable. */
  const sz=await window.SevenZip({
    print:function(){},
    printErr:function(){},
    noInitialRun:true,
  });
  if(!sz||!sz.FS)throw new Error('7z-wasm module failed to initialize');
  const input = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  /* Generate a unique archive name */
  const archiveName='input_'+Date.now()+'.7z';
  /* Write the .7z bytes to the virtual FS */
  const stream=sz.FS.open(archiveName,'w+');
  sz.FS.write(stream,input,0,input.length);
  sz.FS.close(stream);
  /* Create the output directory BEFORE extraction — 7z needs it to exist */
  const outDir='out_'+Date.now();
  try{sz.FS.mkdir(outDir)}catch(e){}
  /* Run 7zz x archive.7z -o<outDir> -y (extract all, yes to all prompts) */
  let exitCode=0;
  try{
    exitCode=sz.callMain(['x',archiveName,'-o'+outDir,'-y','-bso0','-bse0','-bsp0']);
  }catch(e){
    exitCode=typeof e==='number'?e:1;
  }
  /* Recursively walk the output directory and collect all extracted files.
     IMPORTANT: use the full relative path as the key (e.g., "NES/game.nes"),
     NOT just the basename. This way, files in different subfolders don't
     overwrite each other in the files{} object. The caller (processZipEntries)
     extracts the basename via name.split('/').pop(). */
  const files={};
  function walk(dirPath,relPath){
    let entries=[];
    try{entries=sz.FS.readdir(dirPath)}catch(e){return}
    for(const name of entries){
      if(name==='.'||name==='..')continue;
      const fullPath=dirPath+'/'+name;
      const childRelPath=relPath?relPath+'/'+name:name;
      let stat;
      try{stat=sz.FS.stat(fullPath)}catch(e){continue}
      if(sz.FS.isDir(stat.mode)){
        walk(fullPath,childRelPath);
      }else{
        /* Read file contents from the virtual FS */
        try{
          const data=sz.FS.readFile(fullPath);
          /* Use the full relative path as the key — this preserves folder
             structure and avoids basename collisions across folders. */
          files[childRelPath]=data;
        }catch(e){}
      }
    }
  }
  walk(outDir,'');
  /* Cleanup: remove the archive + output dir from the virtual FS */
  try{sz.FS.unlink(archiveName)}catch(e){}
  try{sz.FS.rmdir(outDir,true)}catch(e){}
  /* If extraction produced no files, the archive was probably corrupt or
     password-protected. Throw a descriptive error so the upload handler can
     surface it to the user via the error toast. */
  if(Object.keys(files).length===0){
    throw new Error('7z extraction produced no files. The archive may be corrupt, password-protected, or not actually a .7z file. (Exit code: '+exitCode+')');
  }
  return files;
}
/* Detect archive type by magic bytes — more reliable than file extension. */
function detectArchiveType(buf){
  const bytes=buf instanceof Uint8Array?buf:new Uint8Array(buf);
  /* ZIP: PK\x03\x04 or PK\x05\x06 (empty) or PK\x07\x08 (spanned) */
  if(bytes.length>=4&&bytes[0]===0x50&&bytes[1]===0x4b&&(bytes[2]===0x03||bytes[2]===0x05||bytes[2]===0x07))return 'zip';
  /* 7Z: 37 7A BC AF 27 1C */
  if(bytes.length>=6&&bytes[0]===0x37&&bytes[1]===0x7a&&bytes[2]===0xbc&&bytes[3]===0xaf&&bytes[4]===0x27&&bytes[5]===0x1c)return '7z';
  return null;
}
/* Extract any supported archive type (zip or 7z), dispatching by magic bytes. */
async function extractArchive(buf){
  const type=detectArchiveType(buf);
  if(type==='zip')return await unzipBuffer(buf);
  if(type==='7z')return await un7zBuffer(buf);
  throw new Error('Not a valid zip or 7z archive (magic bytes did not match)');
}
/* Recursively process an array of {name, data} entries from an archive.
   For each entry:
     - If it's a .zip or .7z, extract it (auto-detected by magic bytes) and recurse
     - If it's a ROM file (.nes/.iso/.gba/etc.), save as a ROM
     - If it's an .html file, save as an HTML game
     - Otherwise, skip (we don't import random text/binary files) */
async function processZipEntries(entries,depth,stats){
  if(depth>5){stats.skipped++;return}  /* guard against zip bombs */
  for(const entry of entries){
    const name=entry.name;
    const data=entry.data;
    if(!name||!data)continue;
    /* Skip macOS metadata files and dotfiles */
    if(name.indexOf('__MACOSX/')===0||name.indexOf('/.')>=0||name.split('/').pop().startsWith('.'))continue;
    const lower=name.toLowerCase();
    /* Nested archive (.zip OR .7z) — auto-detect by magic bytes and recurse.
       Pass the Uint8Array directly (NOT data.buffer) to avoid byteOffset issues. */
    if(lower.endsWith('.zip')||lower.endsWith('.7z')){
      try{
        const inner=await extractArchive(data);
        const innerEntries=Object.keys(inner).map(k=>({name:k,data:inner[k]}));
        await processZipEntries(innerEntries,depth+1,stats);
      }catch(e){stats.skipped++}
      continue;
    }
    /* ROM file — pass the Uint8Array directly (saveRomFile/IDB handle it) */
    const baseName=name.split('/').pop();
    if(isRomFile(baseName)){
      try{
        await saveRomFile(baseName,data);
        stats.roms++;
        stats.total++;
      }catch(e){stats.skipped++}
      continue;
    }
    /* === UNSUPPORTED but recognizable ROM extensions ===
       These are real game file extensions for systems whose emulator cores
       are NOT included in EmulatorJS (Atari ST, DOS, MSX, ZX Spectrum, etc.).
       We track them separately so the summary toast can tell the user
       "5 files were Atari ST games which aren't supported" instead of just
       silently ignoring them as "other files". */
    const ext=romExt(baseName);
    const UNSUPPORTED_ROMS={
      /* Note: .ipf and .dim ARE now handled (atarist_ipf / atarist_dim cores)
         — they show a "convert to .st" warning but still get cover art. */
      'stx':'Atari ST (STX format — use .st instead)',
      'app':'Atari ST executable','tos':'Atari ST TOS',
      'dsk':'Amstrad CPC / Spectrum +3',
      'img':'DOS floppy (use .exe or .jsdos instead)','ima':'DOS floppy (use .exe or .jsdos instead)',
      'd88':'NEC PC-88/PC-98','nfd':'NEC PC-88',
      'mx1':'MSX','mx2':'MSX','rom-msx':'MSX',
      'scl':'ZX Spectrum','trd':'ZX Spectrum','z80-spec':'ZX Spectrum',
      'tap-spec':'ZX Spectrum tape',
    };
    if(UNSUPPORTED_ROMS[ext]){
      stats.unsupported=(stats.unsupported||0)+1;
      stats.unsupportedSystems=stats.unsupportedSystems||{};
      stats.unsupportedSystems[UNSUPPORTED_ROMS[ext]]=(stats.unsupportedSystems[UNSUPPORTED_ROMS[ext]]||0)+1;
      continue;
    }
    /* HTML game */
    if(lower.endsWith('.html')||lower.endsWith('.htm')){
      try{
        await saveGameFile(baseName.replace(/\.html?$/i,''),data);
        stats.html++;
        stats.total++;
      }catch(e){stats.skipped++}
      continue;
    }
    /* Ignore other file types (images, .txt, .nfo, .jpg, etc.) */
    stats.ignored++;
  }
}
$('#fileGame').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  /* stats tracks counts for the final summary toast */
  const stats={roms:0,html:0,zips:0,skipped:0,ignored:0,total:0};
  let fatalError=null;
  for(const f of files){
    try{
      const buf=await readRealArrayBuffer(f);
      const lowerName=f.name.toLowerCase();
      /* Detect archive type by magic bytes — supports .zip AND .7z */
      const archiveType=detectArchiveType(buf);
      if(lowerName.endsWith('.zip')||lowerName.endsWith('.7z')||archiveType){
        /* Show a "processing" toast for large archives so the user knows
           something is happening (extraction can take a while for
           multi-GB PS1 collections or 7z LZMA2 decompression). */
        if(buf.byteLength>50*1024*1024){
          const typeLabel=archiveType||'zip';
          Toast.show({icon:'download',title:'Extracting '+typeLabel+'...',body:f.name+' ('+fmtBytes(buf.byteLength)+') — this may take a moment for large collections.'});
        }
        /* First, check if this is likely a MAME arcade ROM zip (only applies
           to actual .zip files, not .7z). MAME ROMs are small and contain
           only arcade-rom extensions. */
        let isMameArcade=false;
        if(archiveType==='zip'||lowerName.endsWith('.zip')){
          try{
            const peek=await unzipBuffer(buf);
            const names=Object.keys(peek);
            if(names.length>0){
              const arcadeExts=['bin','rom','prg','ic1','ic2','ic3','ep1','ep2','epr','mpr','cpu','gfx','snd','voice','prom'];
              const allArcade=names.every(n=>{
                const ext=(n.split('.').pop()||'').toLowerCase();
                return arcadeExts.indexOf(ext)>=0||ext===n.toLowerCase()||n.indexOf('.')<0;
              });
              const hasGameRom=names.some(n=>isRomFile(n.split('/').pop()));
              if(allArcade&&!hasGameRom&&buf.byteLength<15*1024*1024)isMameArcade=true;
            }
          }catch(e){/* not a valid zip, fall through to extraction */}
        }
        if(isMameArcade){
          await saveRomFile(f.name,buf);
          stats.roms++;
          stats.total++;
        }else{
          /* Check if this is a DOS game archive — a zip/7z containing .exe/.com/.bat
             files along with data files (.wad, .dat, .cfg, etc.). If so, save the
             WHOLE archive as a single DOS game (type='dos') so js-dos can mount it
             as a directory and the .exe can find its data files.

             This fixes the #1 issue with DOS game uploads: e.g. DOOM.EXE needs
             DOOM1.WAD to run. If we extract individually, DOOM.EXE is saved but
             DOOM1.WAD is ignored (not a ROM), and the game crashes on launch.

             Detection: peek inside the archive. If it contains ANY .exe/.com/.bat
             files (but NOT .nes/.smc/.iso etc. — those are console ROMs), treat
             it as a DOS game archive and save the whole thing. */
          let isDosArchive=false;
          let dosExeName=null;
          try{
            const peek=await extractArchive(buf);
            const names=Object.keys(peek);
            const hasDosExe=names.some(n=>{
              const ext=romExt(n.split('/').pop());
              if(ext==='exe'||ext==='com'||ext==='bat'){
                /* Prefer .exe over .com/.bat as the "main" executable */
                if(ext==='exe'&&!dosExeName)dosExeName=n.split('/').pop();
                else if(!dosExeName)dosExeName=n.split('/').pop();
                return true;
              }
              return false;
            });
            /* Also check it doesn't contain console ROMs (which would make it
               a multi-system ROM pack, not a DOS game archive) */
            const hasConsoleRom=names.some(n=>{
              const ext=romExt(n.split('/').pop());
              return ROM_CORES[ext]&&ROM_CORES[ext]!=='dos';
            });
            if(hasDosExe&&!hasConsoleRom){
              isDosArchive=true;
            }
          }catch(e){/* peek failed — fall through to normal extraction */}

          if(isDosArchive&&dosExeName){
            /* DOS game archive — save the WHOLE zip as a single DOS game.
               The openDOSFile function handles .zip files by passing them
               directly to js-dos, which mounts them as a directory. The
               dosbox.conf auto-runs the main .exe file. */
            await saveRomFile(f.name,buf);
            stats.roms++;
            stats.total++;
            Toast.show({icon:'gamepad',title:'DOS game imported',body:f.name+' — all game files preserved as a single archive. Double-click to play.'});
          }else{
            /* Collection archive — extract recursively (auto-detects zip vs 7z) */
            stats.zips++;
            const entries=await extractArchive(buf);
            const entryList=Object.keys(entries).map(k=>({name:k,data:entries[k]}));
            await processZipEntries(entryList,0,stats);
          }
        }
      }else if(isRomFile(f.name)){
        await saveRomFile(f.name,buf);
        stats.roms++;
        stats.total++;
      }else{
        await saveGameFile(f.name.replace(/\.html?$/i,''),buf);
        stats.html++;
        stats.total++;
      }
    }catch(err){
      stats.skipped++;
      /* Capture the first fatal error to show the user — much better
         than silently reporting "nothing imported" with no explanation. */
      if(!fatalError)fatalError=err.message||err.toString();
    }
  }
  /* Final summary toast — now with visible error details if something broke */
  let parts=[];
  if(stats.roms>0)parts.push(stats.roms+' ROM'+(stats.roms===1?'':'s'));
  if(stats.html>0)parts.push(stats.html+' HTML game'+(stats.html===1?'':'s'));
  if(stats.zips>0)parts.push(stats.zips+' zip'+(stats.zips===1?'':'s')+' extracted');
  const summary=parts.length?parts.join(', '):'nothing imported';
  let body=summary+' — added to your desktop';
  if(stats.skipped>0){
    body+=' ('+stats.skipped+' skipped';
    if(fatalError){
      body+='. Error: '+fatalError;
    }else{
      body+=' due to errors';
    }
    body+=')';
  }
  /* If there were unsupported-but-recognizable ROM files (e.g. Atari ST .st,
     DOS .exe, MSX .rom, ZX Spectrum .scl), tell the user which systems they
     were and that those aren't emulated. Much better than silently ignoring. */
  if(stats.unsupported>0){
    const sysList=Object.keys(stats.unsupportedSystems||{}).map(s=>stats.unsupportedSystems[s]+' '+s).join(', ');
    body+=' — '+stats.unsupported+' unsupported file'+(stats.unsupported===1?'':'s')+' ('+sysList+'). EmulatorJS does not include cores for these systems.';
  }
  body+='.';
  /* If nothing was imported AND there was an error, show an error toast
     instead of a success toast — so the user immediately sees what broke. */
  if(stats.total===0&&(fatalError||stats.unsupported>0)){
    if(fatalError){
      Toast.show({icon:'error',title:'Upload failed',body:fatalError});
    }else if(stats.unsupported>0){
      /* All files were unsupported systems — show a special toast */
      const sysList=Object.keys(stats.unsupportedSystems||{}).map(s=>stats.unsupportedSystems[s]+' '+s).join(', ');
      Toast.show({icon:'info',title:'No supported games found',body:'All '+stats.unsupported+' files in this archive are for unsupported systems ('+sysList+'). EmulatorJS does not include cores for Atari ST, DOS, MSX, or ZX Spectrum. Supported: NES, SNES, GB, GBA, NDS, N64, PS1, PSP, Genesis, Game Gear, Dreamcast, Amiga, C64, 3DO, and more.'});
    }
  }else{
    Toast.show({icon:'gamepad',title:'Upload complete',body:body});
  }
});
/* === FOLDER UPLOAD HANDLER ===
   When the user clicks "Upload folder" in Game Hub, the browser shows a
   folder picker (webkitdirectory). All files in the folder (and subfolders)
   are returned as a FileList. We filter for game/ROM files and process
   them the same way as individual file uploads — including zip/7z extraction,
   DOS game archive detection, and auto cover art fetching. */
$('#fileGameFolder').addEventListener('change',async e=>{
  const allFiles=[...e.target.files];e.target.value='';if(!allFiles.length)return;
  /* Filter to only game-relevant files — skip images, text, system files */
  const gameFiles=allFiles.filter(f=>{
    const name=f.name.toLowerCase();
    /* Skip macOS metadata and dotfiles */
    if(name.startsWith('.')||name==='Thumbs.db'||name==='.DS_Store')return false;
    /* Check if it's a supported file type */
    if(isRomFile(name))return true;
    if(name.endsWith('.zip')||name.endsWith('.7z'))return true;
    if(name.endsWith('.html')||name.endsWith('.htm'))return true;
    if(name.endsWith('.exe')||name.endsWith('.com')||name.endsWith('.bat'))return true;
    if(name.endsWith('.jsdos')||name.endsWith('.vhd')||name.endsWith('.hdi')||name.endsWith('.hdm'))return true;
    return false;
  });
  if(gameFiles.length===0){
    Toast.show({icon:'info',title:'No game files found',body:'No supported game files (.nes, .smc, .iso, .exe, .zip, etc.) were found in the selected folder.'});
    return;
  }
  Toast.show({icon:'download',title:'Importing folder',body:'Found '+gameFiles.length+' game file'+(gameFiles.length===1?'':'s')+' in folder. Importing...'});
  /* Reuse the same upload logic as individual files */
  const stats={roms:0,html:0,zips:0,skipped:0,ignored:0,total:0,unsupported:0,unsupportedSystems:{}};
  let fatalError=null;
  for(const f of gameFiles){
    try{
      const buf=await readRealArrayBuffer(f);
      const lowerName=f.name.toLowerCase();
      const archiveType=detectArchiveType(buf);
      if(lowerName.endsWith('.zip')||lowerName.endsWith('.7z')||archiveType){
        /* Archive — check if MAME, DOS, or collection */
        let isMameArcade=false;
        if(archiveType==='zip'||lowerName.endsWith('.zip')){
          try{
            const peek=await unzipBuffer(buf);
            const names=Object.keys(peek);
            if(names.length>0){
              const arcadeExts=['bin','rom','prg','ic1','ic2','ic3','ep1','ep2','epr','mpr','cpu','gfx','snd','voice','prom'];
              const allArcade=names.every(n=>{
                const ext=(n.split('.').pop()||'').toLowerCase();
                return arcadeExts.indexOf(ext)>=0||ext===n.toLowerCase()||n.indexOf('.')<0;
              });
              const hasGameRom=names.some(n=>isRomFile(n.split('/').pop()));
              if(allArcade&&!hasGameRom&&buf.byteLength<15*1024*1024)isMameArcade=true;
            }
          }catch(e){}
        }
        if(isMameArcade){
          await saveRomFile(f.name,buf);
          stats.roms++;stats.total++;
        }else{
          /* Check if DOS game archive */
          let isDosArchive=false;let dosExeName=null;
          try{
            const peek=await extractArchive(buf);
            const names=Object.keys(peek);
            const hasDosExe=names.some(n=>{
              const ext=romExt(n.split('/').pop());
              if(ext==='exe'||ext==='com'||ext==='bat'){
                if(ext==='exe'&&!dosExeName)dosExeName=n.split('/').pop();
                else if(!dosExeName)dosExeName=n.split('/').pop();
                return true;
              }
              return false;
            });
            const hasConsoleRom=names.some(n=>{
              const ext=romExt(n.split('/').pop());
              return ROM_CORES[ext]&&ROM_CORES[ext]!=='dos';
            });
            if(hasDosExe&&!hasConsoleRom)isDosArchive=true;
          }catch(e){}
          if(isDosArchive&&dosExeName){
            await saveRomFile(f.name,buf);
            stats.roms++;stats.total++;
          }else{
            stats.zips++;
            const entries=await extractArchive(buf);
            const entryList=Object.keys(entries).map(k=>({name:k,data:entries[k]}));
            await processZipEntries(entryList,0,stats);
          }
        }
      }else if(isRomFile(f.name)){
        await saveRomFile(f.name,buf);
        stats.roms++;stats.total++;
      }else{

        stats.html++;stats.total++;
      }
    }catch(err){stats.skipped++;if(!fatalError)fatalError=err.message||err.toString()}
  }
  /* Summary toast */
  let parts=[];
  if(stats.roms>0)parts.push(stats.roms+' ROM'+(stats.roms===1?'':'s'));
  if(stats.html>0)parts.push(stats.html+' HTML game'+(stats.html===1?'':'s'));
  if(stats.zips>0)parts.push(stats.zips+' zip'+(stats.zips===1?'':'s')+' extracted');
  const summary=parts.length?parts.join(', '):'nothing imported';
  let body=summary+' — added to your desktop';
  if(stats.skipped>0){body+=' ('+stats.skipped+' skipped';if(fatalError){body+='. Error: '+fatalError}else{body+=' due to errors'}body+=')'}
  if(stats.unsupported>0){const sysList=Object.keys(stats.unsupportedSystems||{}).map(s=>stats.unsupportedSystems[s]+' '+s).join(', ');body+=' — '+stats.unsupported+' unsupported file'+(stats.unsupported===1?'':'s')+' ('+sysList+').'}
  body+='.';
  if(stats.total===0&&fatalError){Toast.show({icon:'error',title:'Upload failed',body:fatalError})}

APPS.browser={name:'MAX Browser',icon:'browser',w:1180,h:720,
  build(body,win,arg){
    let tabs=[],act=null;
    const root=h('div',{class:'brw'});
    const strip=h('div',{class:'brw-tabs'});
    const newBtn=h('button',{class:'brw-new',title:'New tab (Ctrl+T)',onclick:()=>addTab()},iconEl('plus',14));
    const bar=h('div',{class:'brw-bar'});
    const url=h('input',{class:'brw-url',spellcheck:false,placeholder:'Search Bing or type a URL'});
    const iframe=h('iframe',{style:{display:'none'},referrerpolicy:'no-referrer-when-downgrade'});
    const homeOv=h('div',{class:'brw-home'});
    const blockOv=h('div',{class:'brw-block'},
      h('b',{},'This site refused to connect'),
      h('p',{},'Some websites (Google, YouTube watch pages, Facebook…) send security headers that forbid embedding inside other apps. MAX Browser cannot bypass that.'),
      h('div',{style:{display:'flex',gap:'8px'}},
        h('button',{class:'btn',onclick:()=>load(iframe.src,true)},iconEl('refresh',14),'Retry'),
        h('button',{class:'btn pri',onclick:()=>window.open(cur().url,'_blank')},iconEl('open',14),'Open in a real tab')));
    const view=h('div',{class:'brw-view'},iframe,homeOv,blockOv);
    const backB=h('button',{class:'brw-nav',title:'Back',onclick:()=>nav(-1)},iconEl('back',15));
    const fwdB=h('button',{class:'brw-nav',title:'Forward',onclick:()=>nav(1)},iconEl('fwd',15));
    const relB=h('button',{class:'brw-nav',title:'Reload',onclick:()=>{const t=cur();if(t&&t.url!=='max://home')load(t.url,true)}},iconEl('refresh',15));
    const homeB=h('button',{class:'brw-nav',title:'Home',onclick:()=>go('max://home')},iconEl('desktop2',15));
    const goB=h('button',{class:'brw-nav',title:'Go',onclick:()=>go(url.value)},iconEl('fwd',15));
    const extB=h('button',{class:'brw-nav',title:'Open in a real browser tab',onclick:()=>{const t=cur();if(t&&t.url!=='max://home'){if(domainBlocksEmbedding(t.url)){openPopupApp(t.url,t.title||'Browser')}else{window.open(t.url,'_blank')}}}},iconEl('open',15));
    bar.append(backB,fwdB,relB,homeB,url,goB,extB);
    root.append(strip,bar,view);
    body.append(root);
    strip.append(newBtn);
    const cur=()=>act;
    function renderStrip(){
      strip.innerHTML='';
      tabs.forEach(t=>{
        const host=t.url==='max://home'?'New tab':(t.url.replace(/^https?:\/\//,'').split('/')[0]);
        const tab=h('div',{class:'brw-tab'+(t===act?' on':''),onclick:()=>{act=t;sync()}},
          iconEl('globe',13),
          h('span',{class:'tt'},t.title||host),
          h('span',{class:'tx',title:'Close tab',onclick:e=>{e.stopPropagation();closeTab(t)}},iconEl('x',9)));
        strip.append(tab);
      });
      strip.append(newBtn);
      backB.disabled=!act||act.hi<=0;
      fwdB.disabled=!act||act.hi>=act.hist.length-1;
    }
    function load(u,force){
      blockOv.classList.remove('show');
      if(u==='max://home'){iframe.style.display='none';homeOv.style.display='block';return}
      homeOv.style.display='none';iframe.style.display='block';
      clearTimeout(load._t);
      /* Wire the load handler ONCE. The previous code fired a fixed 3.5s timer
         after setting src, which falsely flagged ANY site slower than 3.5s as
         "refused to connect" (its contentDocument was still about:blank while
         loading). Now we listen for the iframe's real `load` event and only
         then check whether the load actually produced content. The 20s timer
         below is just a fallback for sites that never respond at all. */
      if(!load._wired){
        load._wired=true;
        iframe.addEventListener('load',()=>{
          setTimeout(()=>{
            try{
              const d=iframe.contentDocument;
              if(d&&(!d.body||d.body.childElementCount===0||d.location.href==='about:blank')){
                blockOv.classList.add('show');
              }
            }catch(e){/* cross-origin = loaded fine */}
          },250);
        });
      }
      iframe.src=u;
      /* 20s fallback: only fires if the iframe NEVER fired its load event
         (genuinely unreachable site). Slow-but-working sites are safe because
         the load handler above clears this via the closure. */
      load._t=setTimeout(()=>{
        try{
          const d=iframe.contentDocument;
          if(d&&(!d.body||d.body.childElementCount===0||d.location.href==='about:blank')){
            blockOv.classList.add('show');
          }
        }catch(e){/* cross-origin = loaded fine */}
      },20000);
    }
    function sync(){
      if(!act)return;
      renderStrip();
      url.value=act.url==='max://home'?'':act.url;
      win.el.querySelector('.wtitle').textContent=(act.url==='max://home'?'New tab':act.url.replace(/^https?:\/\//,'').split('/')[0])+' — MAX Browser';
      load(act.url);
    }
    function go(q,noPush){
      q=(q||'').trim();if(!q)return;
      const u=normalizeUrl(q);
      /* If this URL is known to block iframe embedding, immediately open it in
         a popup app window instead of trying to load it in the iframe (which
         would just show the block error). Same short-circuit as desktop WebApps. */
      if(u!=='max://home'&&domainBlocksEmbedding(u)){
        const ok=openPopupApp(u,act.title||'Browser');
        Toast.show({icon:'globe',title:'Opening in app window',body:ok?(u.replace(/^https?:\/\//,'').split('/')[0]+' cannot be embedded in the browser tab, so it opened in a separate window.'):'Popup blocked — please allow popups for this site.'});
        return;
      }
      if(!noPush){act.hist=act.hist.slice(0,act.hi+1);act.hist.push(u);act.hi=act.hist.length-1}
      act.url=u;act.title=u==='max://home'?'New tab':u.replace(/^https?:\/\//,'').split('/')[0];
      sync();
    }
    function nav(d){
      if(!act)return;
      const ni=act.hi+d;
      if(ni<0||ni>=act.hist.length)return;
      act.hi=ni;act.url=act.hist[ni];
      act.title=act.url==='max://home'?'New tab':act.url.replace(/^https?:\/\//,'').split('/')[0];
      sync();
    }
    function closeTab(t){
      tabs=tabs.filter(x=>x!==t);
      if(!tabs.length){addTab();return}
      if(act===t)act=tabs[tabs.length-1];
      sync();
    }
    function addTab(){const t={title:'New tab',url:'max://home',hist:['max://home'],hi:0};tabs.push(t);act=t;sync()}
    url.addEventListener('keydown',e=>{if(e.key==='Enter')go(url.value)});
    win.keyHandler=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='t'){addTab();e.preventDefault()}};
    /* home page content */
    homeOv.append(
      h('div',{class:'brw-logo'},'MAX',h('em',{}),'Browse'),
      h('div',{class:'brw-tagline'},'A real browser, inside your fake operating system. Welcome to 2009-inception me.'),
      (()=>{const w=h('div',{class:'brw-search'});const inp=h('input',{placeholder:'Search the web with Bing…',onkeydown:e=>{if(e.key==='Enter')go(inp.value)}});w.append(inp);return w})(),
      h('div',{class:'brw-sec'},'Popular sites'),
      (()=>{const g=h('div',{class:'brw-grid'});WEBAPPS.slice(0,24).forEach(a=>{g.append(h('button',{class:'brw-short',onclick:()=>go(a.url)},iconEl('web_'+a.id,34),h('span',{},a.name)))});return g})(),
      h('div',{class:'brw-sec'},'Your desktop website shortcuts'),
      (()=>{const g=h('div',{class:'brw-grid'});const webs=[];fsWalk((n,p)=>{if(n.type==='web')webs.push({n,p})});
        if(!webs.length)g.append(h('div',{class:'gh-empty'},'No website shortcuts yet — right-click the desktop → New → Website shortcut.'));
        webs.forEach(({n,p})=>{g.append(h('button',{class:'brw-short',onclick:()=>go(n.url)},iconEl('globe',30),h('span',{},k0(p).replace(/\.url$/i,''))))});
        return g})(),
      h('div',{class:'brw-note'},'Tip: sites that allow embedding load right here. Sites that refuse show a notice with an "Open in a real tab" escape hatch. Tabs: Ctrl+T.'));
    if(arg&&arg.url){const t={title:'New tab',url:'max://home',hist:['max://home'],hi:0};tabs.push(t);act=t;go(arg.url)}
    else addTab();
  }
};

Dlg.properties=function(it){
  const isFS=!!it.file;
  const node=isFS?it.file.node:null;
  const key=it.key||'';
  const name=it.name;
  let type='Application',loc='Desktop',size='',url=null;
  if(it.web)type='Website shortcut';
  if(it.sys&&it.sys.app)type='Application';
  if(it.sys&&!it.sys.app)type='System folder';
  if(isFS){
    type={folder:'File folder',text:'Text Document',image:'Image file',web:'Website shortcut (.url)',game:'HTML Game (.html)',other:'File'}[node.type]||'File';
    size=fmtBytes(nodeBytes(node));
    if(node.type==='web')url=node.url;
  }
  const layer={close(){document.removeEventListener('keydown',onKey);$('#modalLayer').classList.remove('show');$('#modalLayer').innerHTML=''}};
  const onKey=e=>{if(e.key==='Escape')layer.close()};
  document.addEventListener('keydown',onKey);
  /* helpers to read the (possibly object-shaped) override consistently */
  const curImg=()=>{const o=(S.iconOverrides&&S.iconOverrides[key])||(node&&node.iconData);if(!o)return null;if(typeof o==='string')return o;return o.img||null};
  const curLabel=()=>{const o=S.iconOverrides&&S.iconOverrides[key];if(o&&typeof o==='object'&&o.label)return o.label;return null};
  const curHidden=()=>!!(S.hiddenIcons&&S.hiddenIcons[key]);
  const iconWrap=h('div',{class:'prop-ic'});
  const setIcon=()=>{
    iconWrap.innerHTML='';
    const img=curImg();
    if(img)iconWrap.append(h('img',{src:img}));
    else iconWrap.append(iconEl(it.icon,52));
  };
  setIcon();
  const tbl=h('div',{class:'prop-tbl'});
  const addRow=(k,v)=>tbl.append(h('div',{},h('b',{},k),h('span',{},v)));
  addRow('Type:',type);
  if(url!==null)addRow('Address:',url);
  if(size)addRow('Size:',size+' ('+nodeBytes(node).toLocaleString()+' bytes)');
  addRow('Location:','C:\\Users\\'+S.userName.replace(/\s+/g,'')+'\\'+loc);
  addRow('Created:',fmtDate(Date.now()));
  const resetBtn=h('button',{class:'btn sm',onclick:()=>{
    if(node)delete node.iconData;
    if(S.iconOverrides[key]){
      /* if it had a custom label, keep the label and just drop the icon */
      const o=S.iconOverrides[key];
      if(typeof o==='object'&&o.label)S.iconOverrides[key]={label:o.label};
      else delete S.iconOverrides[key];
    }
    save();setIcon();Desktop.render();resetBtn.disabled=!curImg();
    Toast.show({icon:'check',title:'Icon reset',body:'"'+name+'" is back to its default icon.'});
  }},'Reset icon');
  resetBtn.disabled=!curImg();
  const iconRow=h('div',{class:'prop-iconrow'},
    h('span',{class:'lbl'},'Icon:'),
    h('button',{class:'btn sm pri',onclick:()=>{
      if(isFS){window._iconPropTarget='fs';window._iconPropName=k0(it.file.path);window._iconPropKey=null}
      else{window._iconPropTarget='key';window._iconPropKey=key;window._iconPropName=null}
      $('#fileIcon').click();
    }},iconEl('upload',13),'Upload icon…'),
    resetBtn,
    h('span',{class:'lbl',style:{fontSize:'11px'}},'PNG/JPG/SVG — becomes this icon'));
  /* === NEW: Edit name field (non-FS shortcuts only; FS files use inline rename on desktop) === */
  let nameRow=null;
  if(!isFS){
    const nameInp=h('input',{class:'inp',value:curLabel()||name,style:{width:'220px'}});
    nameInp.addEventListener('change',()=>{
      const v=nameInp.value.trim();
      if(!v||v===name){nameInp.value=curLabel()||name;return}
      if(!S.iconOverrides)S.iconOverrides={};
      if(!S.iconOverrides[key]||typeof S.iconOverrides[key]==='string')S.iconOverrides[key]={img:typeof S.iconOverrides[key]==='string'?S.iconOverrides[key]:undefined,label:v};
      else S.iconOverrides[key].label=v;
      save();Desktop.render();
      Toast.show({icon:'edit',title:'Renamed',body:v});
    });
    nameRow=h('div',{class:'prop-tbl'},h('div',{},h('b',{},'Name:'),h('span',{},nameInp)));
  }
  /* === NEW: Hidden checkbox === */
  const hideInp=h('input',{type:'checkbox'});
  hideInp.checked=curHidden();
  hideInp.addEventListener('change',()=>{
    if(!S.hiddenIcons)S.hiddenIcons={};
    if(hideInp.checked)S.hiddenIcons[key]=true;
    else delete S.hiddenIcons[key];
    save();Desktop.render();
    Toast.show({icon:'eye',title:hideInp.checked?'Hidden':'Visible',body:hideInp.checked?'"'+name+'" is hidden from the desktop. Uncheck to show it again.':'"'+name+'" is back on the desktop.'});
  });
  const hideRow=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginTop:'14px',paddingTop:'14px',borderTop:'1px solid var(--stroke)'}},
    h('label',{class:'sw'},hideInp,h('i')),
    h('div',{},h('b',{style:{fontSize:'13px',color:'var(--text)',fontWeight:'500'}},'Hidden'),
      h('div',{style:{fontSize:'11.5px',color:'var(--text2)',marginTop:'2px'}},'Hide this shortcut from the desktop. Toggle "Show hidden files" in Settings → For developers to see hidden items again.')));
  const onIconUpd=()=>{setIcon();resetBtn.disabled=!curImg()};
  window.addEventListener('icon-updated',onIconUpd);
  const foot=h('div',{class:'m-foot'});
  foot.append(h('button',{class:'btn pri',onclick:()=>{window.removeEventListener('icon-updated',onIconUpd);layer.close()}},'OK'));
  const ml=$('#modalLayer');ml.innerHTML='';ml.classList.add('show');
  ml.append(h('div',{class:'modal'},h('div',{class:'m-title'},name+' — Properties'),
    h('div',{class:'m-body'},h('div',{class:'prop-top'},iconWrap,h('div',{class:'prop-name'},name)),tbl,
      nameRow||'',
      iconRow,
      hideRow),foot));
  ml.addEventListener('click',e=>{if(e.target===ml){window.removeEventListener('icon-updated',onIconUpd);layer.close()}});
};
$('#fileIcon').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const raw=await readRealFile(f);
    const small=raw.length<400000?raw:await downscaleImg(raw,256,256,.9);
    /* === BULK ICON UPLOAD MODE ===
       If window._bulkIconTargets is set (an array of {target, name, key}),
       apply the uploaded image to ALL targets in the array, then clear it.
       This is triggered by right-clicking a multi-selection → "Set icon for
       all N selected". */
    if(window._bulkIconTargets&&window._bulkIconTargets.length>0){
      let count=0;
      for(const tgt of window._bulkIconTargets){
        if(tgt.target==='fs'&&tgt.name){
          const nd=fsGet(['Desktop',tgt.name]);
          if(nd){nd.iconData=small;count++}
        }else if(tgt.target==='key'&&tgt.key){
          if(!S.iconOverrides)S.iconOverrides={};
          const k=tgt.key;
          const existing=S.iconOverrides[k];
          const label=(existing&&typeof existing==='object'&&existing.label)?existing.label:null;
          S.iconOverrides[k]=label?{img:small,label}:small;
          count++;
        }
      }
      /* Clear bulk mode so the next #fileIcon open (from Properties) uses
         single-item mode again. */
      window._bulkIconTargets=null;
      save();Desktop.render();
      Toast.show({icon:'check',title:'Icon applied to all',body:f.name+' is now the icon for '+count+' item'+(count===1?'':'s')+'.'});
      return;
    }
    /* === SINGLE ICON UPLOAD MODE (from Properties dialog) === */
    if(window._iconPropTarget==='fs'&&window._iconPropName){
      const nd=fsGet(['Desktop',window._iconPropName]);
      if(nd)nd.iconData=small;
    }else if(window._iconPropKey){
      if(!S.iconOverrides)S.iconOverrides={};
      const k=window._iconPropKey;
      /* preserve any existing custom label when replacing the icon */
      const existing=S.iconOverrides[k];
      const label=(existing&&typeof existing==='object'&&existing.label)?existing.label:null;
      S.iconOverrides[k]=label?{img:small,label}:small;
    }
    save();Desktop.render();
    window.dispatchEvent(new CustomEvent('icon-updated'));
    Toast.show({icon:'check',title:'Icon updated',body:f.name+' is now the icon.'});
  }catch(err){Toast.show({icon:'error',title:'Icon upload failed',body:'Could not read that image.'})}
});

function pgStorage(main){
  pgTitle(main,'Storage','See how much real device storage Windows 32BIT MAX can use.');
  const docs=(JSON.stringify(F?.Documents||{}).length),pics=(JSON.stringify(F?.Pictures||{}).length),desk=(JSON.stringify(F?.Desktop||{}).length);
  /* Real device storage via navigator.storage.estimate().
     This is the actual quota the browser grants the origin — on desktop Chrome
     that's typically 60% of free disk space (often hundreds of GB). */
  const driveCard=h('div',{class:'card plain'},h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'8px'}},h('b',{style:{fontSize:'13.5px'}},'Local Disk (C:) — '+diskLabel()),h('span',{style:{fontSize:'12px',color:'var(--text2)'}},DISK_INFO.ready?'Loading…':'Loading…')));
  const bar=h('div',{class:'stor-bar'},h('i',{style:{width:'0%',background:'#4cc2ff'}}));
  const leg=h('div',{class:'stor-leg'},h('span',{},h('em',{style:{background:'#4cc2ff'}}),'Used by 32BIT MAX'));
  driveCard.append(bar,leg);
  main.append(driveCard,
    card(
      row('Temporary files','Clear browser caches and unused IndexedDB entries.',h('button',{class:'btn',onclick:async()=>{
        /* Clear orphaned IDB game entries that no longer have a desktop file pointing to them.
           IMPORTANT: must check BOTH type==='game' AND type==='rom' — ROM files
           also store their data in IndexedDB via idbKey. The old code only
           checked type==='game', which caused ALL ROM data to be deleted when
           the user clicked "Remove files" (Temporary files cleanup), because
           ROM idbKeys were not in the usedKeys set and were treated as orphaned. */
        const usedKeys=new Set();
        fsWalk((n)=>{if((n.type==='game'||n.type==='rom')&&n.idbKey)usedKeys.add(n.idbKey)});
        /* Also preserve thumbnail listing cache keys */
        for(const k in _thumbListingCache){usedKeys.add('thumblisting_'+k)}
        let cleared=0;
        if(IDB.db){try{const tx=IDB.db.transaction('g','readonly');const all=await new Promise(res=>{const rq=tx.objectStore('g').getAllKeys();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([])});for(const k of all){if(!usedKeys.has(k)){await IDB.del(k);cleared++}}}catch(e){}}
        await refreshDiskInfo();pgStorage(main);
        Toast.show({icon:'check',title:'Cleanup complete',body:cleared>0?'Removed '+cleared+' orphaned game file(s).':'No orphaned files found.'});
      }},'Remove files'),'trash'),
      row('Storage Sense','Automatically request persistent storage so the browser won\'t evict your files.',toggle(()=>!!DISK_INFO.persisted,async v=>{if(v&&navigator.storage&&navigator.storage.persist){try{const ok=await navigator.storage.persist();DISK_INFO.persisted=ok;if(!ok)Toast.show({icon:'info',title:'Permission needed',body:'Your browser declined persistent storage. Files will still work but may be evicted under disk pressure.'})}catch(e){}}else{DISK_INFO.persisted=false}save();pgStorage(main)}),'disk'),
      row('Refresh storage info','Re-query the browser for current quota and usage.',h('button',{class:'btn',onclick:async()=>{await refreshDiskInfo();pgStorage(main);Toast.show({icon:'disk',title:'Storage refreshed',body:'Local Disk (C:) shows '+diskLabel()+' ('+fmtBytes(diskFree())+' free)'})}},'Refresh'),'refresh')),
    h('div',{class:'note'},'This shows the real storage the browser grants this site (via navigator.storage.estimate()). On desktop Chrome that is typically 60% of your free disk space. Uploaded games and large files are stored in IndexedDB, which uses this quota — so you really can fill it up with hundreds of GB of games if your device has the space.')
  );
  /* Now async-load the real numbers and update the card in place */
  refreshDiskInfo().then(()=>{
    const used=diskUsage(),cap=diskQuota(),pct=Math.min(100,used/cap*100);
    driveCard.querySelector('span').textContent=fmtBytes(used)+' used of '+fmtBytes(cap)+(DISK_INFO.persisted?' • Persistent':'');
    bar.firstChild.style.width=pct+'%';
    /* Build a more detailed legend breaking down usage by source */
    leg.innerHTML='';
    const lsBytes=storageBytes();
    const idbBytes=Math.max(0,used-lsBytes);
    leg.append(
      h('span',{},h('em',{style:{background:'#4cc2ff'}}),'Settings & files (localStorage) '+fmtBytes(lsBytes)),
      h('span',{},h('em',{style:{background:'#886ce4'}}),'Uploaded games (IndexedDB) '+fmtBytes(idbBytes)),
      h('span',{},h('em',{style:{background:'#7ee0a3'}}),'Free '+fmtBytes(diskFree()))
    );
  });
}

  build(body,win,arg){
    const st={page:arg&&typeof arg==='string'?arg:'sys-display',q:''};

      });
      if(q&&!navList.children.length)navList.append(h('div',{style:{padding:'10px',color:'var(--text3)',fontSize:'12px'}},'No settings match "'+esc(st.q)+'"'));
    };

      pg.fn(mainC);

/* ==================== POWER FLOWS ==================== */
let shellBooted=false;
function startDesktopExperience(){
  if(shellBooted){$('#shell').classList.add('show');return}
  shellBooted=true;
  $('#shell').classList.add('show');
  applyTheme();
  Desktop.render();Desktop.iconSize();
  Taskbar.render();
  Battery.init();
  Sounds.play('logon');
  /* startup apps */
  Object.keys(S.startupApps||{}).forEach(id=>{if(S.startupApps[id]&&APPS[id]&&!S.uninstalled.includes(id))setTimeout(()=>openApp(id),400)});
  if(S.firstRun){
    S.firstRun=false;save(true);
    setTimeout(()=>Toast.show({icon:'windows',title:'Welcome to Windows 32BIT MAX',body:'Right-click the desktop, open Start, and explore Settings for every possible option.'}),1200);
    setTimeout(()=>Toast.show({icon:'image',title:'Make it yours',body:'Settings → Personalization → Background lets you upload any image. Custom cursors live in Accessibility → Mouse pointer.'}),5200);
  }
  if(S.updateState==='ready')setTimeout(()=>Toast.show({icon:'update',title:'Update installed',body:'MAX Cumulative Update KB32402026 completed successfully.'}),2600);
}
function bootUp(){
  const boot=$('#boot'),bt=$('#bootText');
  boot.classList.remove('fade');boot.classList.add('show');
  bt.style.display='none';bt.textContent='';
  const finish=()=>{
    boot.classList.add('fade');
    setTimeout(()=>boot.classList.remove('show','fade'),520);
    if(S.lockOnBoot!==false)lockScreen();
    else startDesktopExperience();
  };
  if(S.verboseBoot){
    bt.style.display='block';
    const lines=['[ MAXBIOS v32.1 ] CPU: MAXCore i9-32000 @ 3.2 GHz','[ MAXBIOS ] Memory test: '+(navigator.deviceMemory?navigator.deviceMemory*1024:'32768')+'MB OK','[ MAXBIOS ] Detecting drives... C: device storage ('+diskLabel()+')','[ maxloader ] Loading kernel32.max ...','[ maxloader ] Loading hal32.max ... OK','[ maxkernel ] Starting maxshell compositor','[ maxkernel ] Mounting virtual file system','[ maxnet ] Wi-Fi '+(S.wifi&&!S.airplane?'connected ('+S.wifiNet+')':'disabled'),'[ maxshell ] Registering '+(Object.keys(APPS).length)+' apps','[ maxshell ] Developer Mode: '+(S.devMode?'ON':'off'),'[ OK ] Handing off to Windows 32BIT MAX...',''];
    let i=0;
    const iv=setInterval(()=>{
      bt.textContent+=lines[i]+'\n';i++;
      if(i>=lines.length){clearInterval(iv);setTimeout(finish,420)}
    },140);
  }else{
    setTimeout(finish,2300);
  }
}
function lockScreen(){
  closePopups();
  $('#shell').classList.remove('show');
  const l=$('#lock');
  l.classList.add('show');l.classList.remove('login-view');
  $('#lockErr').textContent='';
  $('#lockPin').value='';$('#lockPin').style.display='none';
  $('#lockBtn').textContent='Sign in';

}
function showLoginView(){
  const l=$('#lock');

  l.classList.add('login-view');
  $('#lockAvatar').style.backgroundImage=S.avatar?`url("${S.avatar}")`:'none';
  $('#lockAvatar').style.background=S.avatar?'':AVCOLORS[S.avatarColor]||'linear-gradient(135deg,#2E7FD8,#4CC2FF)';
  $('#lockAvatar').textContent=S.avatar?'':S.userName[0].toUpperCase();
  $('#lockName').textContent=S.userName;
  $('#lockPin').style.display=S.pin?'block':'none';
  $('#lockBtn').textContent='Sign in';
  $('#lockErr').textContent='';
  setTimeout(()=>{if(S.pin)$('#lockPin').focus()},150);
}
function tryUnlock(){
  if(S.pin){
    const v=$('#lockPin').value;
    if(v!==S.pin){
      $('#lockErr').textContent='Incorrect PIN. Try again.';
      $('#lockPin').classList.add('shake');Sounds.play('error');
      setTimeout(()=>$('#lockPin').classList.remove('shake'),380);
      $('#lockPin').value='';$('#lockPin').focus();
      return;
    }
  }
  const l=$('#lock');
  l.classList.remove('show','login-view');
  startDesktopExperience();
  Sounds.play('unlock');
}

/* === Horizontal wheel scroll for the desktop icon grid ===
   When the mouse wheel is scrolled over the #icons grid, scroll it
   horizontally instead of vertically (since the grid flows column-major
   and only overflows horizontally). This makes navigating large game
   collections much more natural — just scroll the wheel.
   Holding Shift uses the standard vertical scroll (rarely needed). */
$('#icons').addEventListener('wheel',e=>{
  if(e.shiftKey)return; /* let Shift+wheel do default (vertical) */
  if(e.deltaY===0)return;
  /* Only intercept if there's actually horizontal overflow to scroll */
  const cont=$('#icons');
  if(cont.scrollWidth<=cont.clientWidth)return;
  e.preventDefault();
  cont.scrollLeft+=e.deltaY;
},{passive:false});
$('#desktop').addEventListener('pointerdown',e=>{
  if(e.target.id==='desktop'||e.target.id==='icons'){
    /* Don't start marquee if clicking on the horizontal scrollbar area.
       The scrollbar is at the bottom of #icons. If the user is trying to
       drag the scrollbar thumb, we should let the browser handle it. */
    const cont=$('#icons');
    if(cont){
      const sbH=cont.offsetHeight-cont.clientHeight;
      if(sbH>0){
        const rect=cont.getBoundingClientRect();
        /* If click is in the bottom sbH pixels (scrollbar zone), skip marquee */
        if(e.clientY>rect.bottom-sbH-2)return;
      }
    }
    /* empty desktop area → start marquee (rubber-band) selection. */
    closePopups();
    Desktop.marqueeStart(e);
  }
});
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.flyout,#taskbar,.menu'))closePopups();
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePopups();Ctx.closeAll()}

  if(top&&top.keyHandler&&!e.target.closest('input,textarea'))top.keyHandler(e);
});
/* Forward keyup to the active window's keyHandler too — without this, releasing a
   movement key after the iframe lost focus would never reach the game and the key
   would "stick" (your character keeps walking). See openGameFile for the receiver. */

$('#fileWall').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const raw=await readRealFile(f);
  S.wallCustom=raw;
  let val=raw;
  if(raw.startsWith('data:image/svg')||raw.length<1200000)val=raw;
  else val=await downscaleImg(raw,2560,1600,.87);
  S.wallpaper={type:'image',value:val,fit:S.wallpaper.fit||'cover'};
  try{save(true);Toast.show({icon:'image',title:'Wallpaper applied',body:f.name+' is now your desktop background.'})}
  catch(err){Toast.show({icon:'error',title:'Image too large',body:'Try a smaller image.'})}
  applyWall();Taskbar.render();
});
$('#fileLock').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const raw=await readRealFile(f);
  const val=raw.length<1200000?raw:await downscaleImg(raw,2560,1600,.87);
  S.lockCustom=val;S.lockWall={type:'image',value:val};save(true);applyLockWall();
  Toast.show({icon:'image',title:'Lock screen updated',body:f.name});
});
$('#fileCursor').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const raw=await readRealFile(f);
  const img=new Image();
  img.onload=()=>{
    const size=clamp(S.customCursor.size||40,16,128);
    const c=document.createElement('canvas');c.width=size;c.height=size;
    const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';
    const scale=Math.min(size/img.width||1,size/img.height||1,1.001);
    const w=(img.width||size)*scale,hh=(img.height||size)*scale;
    ctx.drawImage(img,(size-w)/2,(size-hh)/2,w,hh);
    let url='';
    try{url=c.toDataURL('image/png')}catch(err){url=raw}
    S.customCursor.img=url;S.customCursor.on=true;S.pointerStyle='custom';
    save(true);applyCursor();
    Toast.show({icon:'check',title:'Custom cursor applied',body:f.name+' — set hotspot in Accessibility → Mouse pointer if the tip is off.'});
    const sw=WM.wins.get([...WM.wins.keys()].find(id=>WM.wins.get(id).appId==='settings'));
    if(sw){const pg=SETTINGS_PAGES.find(p=>p.id==='acc-mouse');if(pg)pg.fn(sw.body.querySelector('.sett-main'))}
  };
  img.onerror=()=>Toast.show({icon:'error',title:'Could not read image',body:'Try a different file.'});
  img.src=raw;
});
$('#fileAvatar').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const raw=await readRealFile(f);
  S.avatar=await downscaleImg(raw,256,256,.88);save(true);
  Toast.show({icon:'check',title:'Profile photo updated'});
});
/* window resize */
addEventListener('resize',()=>{
  for(const w of WM.wins.values()){
    const A=WM.area();
    if(w.max){WM.setRect(w,{x:0,y:0,w:A.w,h:A.h})}
    else{const r={};if(w.x>A.w-60)r.x=Math.max(6,A.w-w.w-10);if(w.y>A.h-30)r.y=Math.max(6,A.h-80);WM.setRect(w,r)}
  }
  /* Re-evaluate mobile mode on resize/orientation change — a tablet rotated
     from portrait to landscape (or a window resized across the 600px threshold)
     should flip the UI. Only re-apply if the detected state actually changed. */
  if(typeof isMobileDevice!=='undefined'){
    const nowMobile=isMobileDevice();
    if(nowMobile!==_mobileActive){applyMobileMode()}
  }
});
/* Orientation change fires separately on mobile and needs the same re-eval */
addEventListener('orientationchange',()=>setTimeout(()=>{
  if(typeof isMobileDevice!=='undefined'){const nowMobile=isMobileDevice();if(nowMobile!==_mobileActive)applyMobileMode()}
},300));
